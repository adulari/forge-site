  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

accent:#FF8A30; --accent-hi:#FFB068; --code:#FFD9B8; --gold:#FFD040; --cy:#4BD4DA;\n  --warn:#EEBC52; --red:#F35C5C; --o2:#FF9828; --o3:#FF6020; --navbg:rgba(10,8,18,.85);\n}\n[data-forge-root][data-theme=\"light\"] {\n  --bg:#F1EEE8; --panel:#FAF8F4; --panel2:#EFEAE0; --panel-hot:#F7EDE0;\n  --border:#E5E0D5; --border2:#D8D3C6; --border-hot:#E4C9A5;\n  --ink:#211F1B; --ink2:#3A362E; --muted:#57544C; --muted2:#6B675C; --dim:#8B8779;\n  --accent:#B65108; --accent-hi:#93430A; --code:#7A3E10; --gold:#8F6A00; --cy:#0E7C86;\n  --warn:#9A6E0C; --red:#C93835; --o2:#A85408; --o3:#B0400E; --navbg:rgba(246,242,235,.88);\n}\nbody:has([data-theme=\"light\"]) { background:#F1EEE8; }\n@media (max-width: 900px) {\n  [data-sidebar] { position:static !important; width:100% !important; height:auto !important; max-height:280px; border-right:none !important; border-bottom:1px solid var(--border); }\n  [data-shell] { flex-direction:column !important; }\n}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div data-forge-root=\"1\" data-theme=\"{{ theme }}\" style=\"font-family:'Geist','Helvetica Neue',sans-serif; background:var(--bg); color:var(--ink); min-height:100vh;\">\n  <div data-screen-label=\"docs top bar\" style=\"position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:16px; padding:12px clamp(16px,3vw,28px); background:var(--navbg); backdrop-filter:blur(14px); border-bottom:1px solid var(--border);\">\n    <a href=\"index.html\" style=\"display:flex; align-items:center; gap:10px; color:var(--ink);\">\n      <img src=\"36b4c62f-3f9e-4979-a292-4b63241218ea\" alt=\"Forge\" style=\"width:26px; height:26px; border-radius:6px;\">\n      <span style=\"font-weight:700; font-size:16px;\">Forge<\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--accent); border:1px solid var(--border-hot); border-radius:4px; padding:2px 7px;\">docs<\u002Fspan>\n    <\u002Fa>\n    <input placeholder=\"Search docs…  ( / )\" value=\"{{ q }}\" sc-camel-on-change=\"{{ setQ }}\" style=\"flex:1; max-width:340px; margin-left:12px; background:var(--panel); border:1px solid var(--border2); border-radius:8px; padding:8px 14px; color:var(--ink); font-size:13.5px; font-family:'Geist',sans-serif; outline:none;\">\n    <span style=\"flex:1;\"><\u002Fspan>\n    <a href=\"index.html\" data-navlink=\"1\" style=\"color:var(--muted); font-size:13.5px;\">← forge.adulari.dev<\u002Fa>\n    <span title=\"Toggle light/dark\" style=\"cursor:pointer; color:var(--muted2); font-size:16px; line-height:1; padding:6px 9px; border-radius:8px;\" style-hover=\"color:var(--ink); background:rgba(255,138,48,.10);\" sc-camel-on-click=\"{{ toggleTheme }}\">{{ themeGlyph }}<\u002Fspan>\n    <a href=\"https://github.com/adulari/forge\" style=\"border:1px solid var(--border2); border-radius:6px; padding:6px 12px; color:var(--ink2); font-size:12.5px; font-family:'JetBrains Mono',monospace;\" style-hover=\"border-color:var(--accent); color:var(--accent);\">★ GitHub<\u002Fa>\n  <\u002Fdiv>\n  <div data-shell=\"1\" style=\"display:flex; max-width:1240px; margin:0 auto;\">\n    <nav data-sidebar=\"1\" style=\"position:sticky; top:57px; width:250px; flex:none; height:calc(100vh - 57px); overflow-y:auto; border-right:1px solid var(--border); padding:22px 14px 40px;\">\n      <sc-for list=\"{{ navItems }}\" as=\"it\" hint-placeholder-count=\"12\">\n        <div style=\"font-family:{{ it.font }}; font-size:{{ it.size }}px; color:{{ it.color }}; background:{{ it.bg }}; font-weight:{{ it.weight }}; padding:{{ it.pad }}; margin-top:{{ it.mt }}px; border-radius:7px; cursor:{{ it.cursor }}; border-left:2px solid {{ it.edge }};\" sc-camel-on-click=\"{{ it.pick }}\">{{ it.label }}<\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fnav>\n    <main style=\"flex:1; min-width:0; padding:clamp(24px,4vw,52px) clamp(18px,4vw,56px) 80px; max-width:820px;\">\n\n      <div style=\"display:{{ secQuickstart }};\" data-screen-label=\"quickstart\">\n        <h1 style=\"margin:0; font-size:34px; letter-spacing:-0.02em;\">Quickstart<\u002Fh1>\n        <p style=\"margin:14px 0 0; color:var(--muted); font-size:16px; line-height:1.65; max-width:640px;\">Install to first chat in about 5 minutes. No credit card, and no API key needed to try it: the <span style=\"font-family:'JetBrains Mono',monospace; font-size:14px; color:var(--cy);\">--mock<\u002Fspan> provider runs a deterministic offline model.<\u002Fp>\n        <h2 style=\"margin:36px 0 0; font-size:20px;\">1 · Install<\u002Fh2>\n        <sc-for list=\"{{ qsInstall }}\" as=\"c\" hint-placeholder-count=\"1\">\n          <div style=\"display:flex; align-items:center; gap:14px; font-family:'JetBrains Mono',monospace; font-size:13.5px; background:var(--panel); border:1px solid var(--border2); border-radius:8px; padding:12px 18px; margin-top:10px;\"><span style=\"color:var(--accent);\">$<\u002Fspan><span style=\"color:var(--code); flex:1; overflow-x:auto; white-space:pre;\">{{ c.cmd }}<\u002Fspan><span style=\"color:var(--dim); font-size:12px;\">{{ c.note }}<\u002Fspan><span style=\"color:var(--muted2); cursor:pointer;\" sc-camel-on-click=\"{{ c.pick }}\">{{ c.label }}<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-for>\n        <p style=\"margin:12px 0 0; color:var(--dim); font-size:13.5px;\">Verifies the SHA-256, installs to ~/.local/bin, offers the desktop app alongside. Also: Homebrew, Cargo (crate is forge-agent), PowerShell, or build from source.<\u002Fp>\n        <h2 style=\"margin:32px 0 0; font-size:20px;\">2 · Connect providers<\u002Fh2>\n        <sc-for list=\"{{ qsSetup }}\" as=\"c\" hint-placeholder-count=\"2\">\n          <div style=\"display:flex; align-items:center; gap:14px; font-family:'JetBrains Mono',monospace; font-size:13.5px; background:var(--panel); border:1px solid var(--border2); border-radius:8px; padding:12px 18px; margin-top:10px;\"><span style=\"color:var(--accent);\">$<\u002Fspan><span style=\"color:var(--code); flex:1; overflow-x:auto; white-space:pre;\">{{ c.cmd }}<\u002Fspan><span style=\"color:var(--dim); font-size:12px;\">{{ c.note }}<\u002Fspan><span style=\"color:var(--muted2); cursor:pointer;\" sc-camel-on-click=\"{{ c.pick }}\">{{ c.label }}<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-for>\n        <p style=\"margin:12px 0 0; color:var(--dim); font-size:13.5px;\">Keys are stored in your OS keyring, never in config files. See <span style=\"color:var(--accent); cursor:pointer;\" sc-camel-on-click=\"{{ goFree }}\">Free providers<\u002Fspan> for the best zero-cost setup.<\u002Fp>\n        <h2 style=\"margin:32px 0 0; font-size:20px;\">3 · Work<\u002Fh2>\n        <sc-for list=\"{{ qsWork }}\" as=\"c\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex; align-items:center; gap:14px; font-family:'JetBrains Mono',monospace; font-size:13.5px; background:var(--panel); border:1px solid var(--border2); border-radius:8px; padding:12px 18px; margin-top:10px;\"><span style=\"color:var(--accent);\">$<\u002Fspan><span style=\"color:var(--code); flex:1; overflow-x:auto; white-space:pre;\">{{ c.cmd }}<\u002Fspan><span style=\"color:var(--dim); font-size:12px;\">{{ c.note }}<\u002Fspan><span style=\"color:var(--muted2); cursor:pointer;\" sc-camel-on-click=\"{{ c.pick }}\">{{ c.label }}<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"margin-top:28px; border:1px solid var(--border-hot); background:var(--panel-hot); border-radius:10px; padding:16px 20px; color:var(--muted); font-size:14.5px; line-height:1.6;\">Zero keys? <span style=\"font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--cy);\">forge tour --demo<\u002Fspan> runs one full agent turn offline in a scratch directory: routing line, a tool call, the final answer.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:{{ secFree }};\" data-screen-label=\"free providers\">\n        <h1 style=\"margin:0; font-size:34px; letter-spacing:-0.02em;\">Free providers<\u002Fh1>\n        <p style=\"margin:14px 0 0; color:var(--muted); font-size:16px; line-height:1.65; max-width:640px;\">Forge runs free with zero paid keys. Connect a few of these and the mesh routes across them, failing over automatically when one is throttled.<\u002Fp>\n        <div style=\"margin-top:28px; overflow-x:auto;\">\n          <div style=\"display:grid; grid-template-columns:110px 1.6fr 1fr 150px; min-width:640px; font-size:13.5px; border:1px solid var(--border); border-radius:10px; overflow:hidden;\">\n            <div style=\"padding:12px 16px; background:var(--panel2); color:var(--dim); font-family:'JetBrains Mono',monospace; font-size:11px;\">PROVIDER<\u002Fdiv><div style=\"padding:12px 16px; background:var(--panel2); color:var(--dim); font-family:'JetBrains Mono',monospace; font-size:11px;\">BEST FREE MODELS<\u002Fdiv><div style=\"padding:12px 16px; background:var(--panel2); color:var(--dim); font-family:'JetBrains Mono',monospace; font-size:11px;\">LIMITS<\u002Fdiv><div style=\"padding:12px 16px; background:var(--panel2); color:var(--dim); font-family:'JetBrains Mono',monospace; font-size:11px;\">CONNECT<\u002Fdiv>\n            <sc-for list=\"{{ freeRows }}\" as=\"r\" hint-placeholder-count=\"6\">\n              <div style=\"display:contents;\">\n                <div style=\"padding:12px 16px; border-top:1px solid var(--border); color:var(--ink); font-weight:600;\">{{ r.name }}<\u002Fdiv>\n                <div style=\"padding:12px 16px; border-top:1px solid var(--border); color:var(--muted2); font-family:'JetBrains Mono',monospace; font-size:12.5px;\">{{ r.models }}<\u002Fdiv>\n                <div style=\"padding:12px 16px; border-top:1px solid var(--border); color:var(--cy); font-family:'JetBrains Mono',monospace; font-size:12.5px;\">{{ r.limits }}<\u002Fdiv>\n                <div style=\"padding:12px 16px; border-top:1px solid var(--border); color:var(--code); font-family:'JetBrains Mono',monospace; font-size:12.5px;\">{{ r.connect }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:14px 0 0; color:var(--dim); font-size:13px;\">Mid-2026 figures; limits shift month to month. Model catalogs are discovered live, so new free models appear automatically.<\u002Fp>\n        <h2 style=\"margin:34px 0 0; font-size:20px;\">Stack keys to multiply limits<\u002Fh2>\n        <p style=\"margin:10px 0 0; color:var(--muted); font-size:14.5px; line-height:1.6; max-width:640px;\">Run <span style=\"font-family:'JetBrains Mono',monospace; font-size:13px;\">forge auth &lt;provider&gt;<\u002Fspan> again to add another key. Forge round-robins across all of them, so two free Groq keys ≈ double the requests per minute, and a throttled key's retry lands on the next one.<\u002Fp>\n        <sc-for list=\"{{ freeCmds }}\" as=\"c\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex; align-items:center; gap:14px; font-family:'JetBrains Mono',monospace; font-size:13.5px; background:var(--panel); border:1px solid var(--border2); border-radius:8px; padding:12px 18px; margin-top:10px;\"><span style=\"color:var(--accent);\">$<\u002Fspan><span style=\"color:var(--code); flex:1; overflow-x:auto; white-space:pre;\">{{ c.cmd }}<\u002Fspan><span style=\"color:var(--dim); font-size:12px;\">{{ c.note }}<\u002Fspan><span style=\"color:var(--muted2); cursor:pointer;\" sc-camel-on-click=\"{{ c.pick }}\">{{ c.label }}<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"margin-top:24px; border:1px solid var(--border-hot); background:var(--panel-hot); border-radius:10px; padding:16px 20px; color:var(--muted); font-size:14.5px; line-height:1.6;\">A solid all-free setup: <span style=\"font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--code);\">groq + nvidia + gemini<\u002Fspan>. Fast small-task routing, 100+ frontier models, and a 1M-context model, all at $0.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:{{ secMesh }};\" data-screen-label=\"mesh routing\">\n        <h1 style=\"margin:0; font-size:34px; letter-spacing:-0.02em;\">Mesh routing<\u002Fh1>\n        <p style=\"margin:14px 0 0; color:var(--muted); font-size:16px; line-height:1.65; max-width:640px;\">You don't pick a model; you connect providers and let Forge pick. Every task is classified into a tier, then routed to the cheapest model that meets the bar, ranked against real Artificial Analysis intelligence and coding scores.<\u002Fp>\n        <div style=\"display:grid; grid-template-columns:110px 1fr 1fr; margin-top:28px; font-size:13.5px; border:1px solid var(--border); border-radius:10px; overflow:hidden;\">\n          <div style=\"padding:12px 16px; background:var(--panel2); color:var(--dim); font-family:'JetBrains Mono',monospace; font-size:11px;\">TIER<\u002Fdiv><div style=\"padding:12px 16px; background:var(--panel2); color:var(--dim); font-family:'JetBrains Mono',monospace; font-size:11px;\">EXAMPLES<\u002Fdiv><div style=\"padding:12px 16px; background:var(--panel2); color:var(--dim); font-family:'JetBrains Mono',monospace; font-size:11px;\">GOES TO<\u002Fdiv>\n          <div style=\"padding:12px 16px; border-top:1px solid var(--border); color:var(--gold); font-family:'JetBrains Mono',monospace;\">trivial<\u002Fdiv><div style=\"padding:12px 16px; border-top:1px solid var(--border); color:var(--muted2);\">single-line edits, simple lookups<\u002Fdiv><div style=\"padding:12px 16px; border-top:1px solid var(--border); color:var(--ink2);\">local / cheapest free model<\u002Fdiv>\n          <div style=\"padding:12px 16px; border-top:1px solid var(--border); color:var(--o2); font-family:'JetBrains Mono',monospace;\">standard<\u002Fdiv><div style=\"padding:12px 16px; border-top:1px solid var(--border); color:var(--muted2);\">multi-file refactors, code review<\u002Fdiv><div style=\"padding:12px 16px; border-top:1px solid var(--border); color:var(--ink2);\">mid-tier cloud model<\u002Fdiv>\n          <div style=\"padding:12px 16px; border-top:1px solid var(--border); color:var(--o3); font-family:'JetBrains Mono',monospace;\">complex<\u002Fdiv><div style=\"padding:12px 16px; border-top:1px solid var(--border); color:var(--muted2);\">architecture, deep debugging, new features<\u002Fdiv><div style=\"padding:12px 16px; border-top:1px solid var(--border); color:var(--ink2);\">frontier model<\u002Fdiv>\n        <\u002Fdiv>\n        <h2 style=\"margin:34px 0 0; font-size:20px;\">Failover rules<\u002Fh2>\n        <div style=\"margin-top:14px; display:flex; flex-direction:column; gap:12px; color:var(--muted); font-size:14.5px; line-height:1.6;\">\n          <div><span style=\"color:var(--warn); font-family:'JetBrains Mono',monospace; font-size:13px;\">429 rate limit<\u002Fspan> · a per-minute free-tier reset is waited out and the best model retried, not immediately downgraded.<\u002Fdiv>\n          <div><span style=\"color:var(--warn); font-family:'JetBrains Mono',monospace; font-size:13px;\">transient 5xx<\u002Fspan> · retried on the same model with bounded backoff.<\u002Fdiv>\n          <div><span style=\"color:var(--red); font-family:'JetBrains Mono',monospace; font-size:13px;\">permanent errors<\u002Fspan> · no tool support, 402 payment-required: fail over at once, down the whole ranked catalog, across providers.<\u002Fdiv>\n        <\u002Fdiv>\n        <h2 style=\"margin:34px 0 0; font-size:20px;\">Budgets and conservation<\u002Fh2>\n        <div style=\"margin-top:12px; font-family:'JetBrains Mono',monospace; font-size:13px; line-height:1.9; color:var(--ink2); background:var(--panel); border:1px solid var(--border2); border-radius:8px; padding:16px 20px; overflow-x:auto; white-space:pre;\">[mesh]\ndaily_budget_usd = 5.0\nmonthly_cap_usd  = 50.0\ncredit_mode      = \"strict\"   <span style=\"color:var(--dim);\"># free + subscription only, never a paid key<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:12px 0 0; color:var(--muted); font-size:14.5px; line-height:1.6; max-width:640px;\">Under budget pressure, or to spare a metered plan, the mesh spreads standard and complex work onto free frontier models. Auto-downshift kicks in as caps approach.<\u002Fp>\n        <h2 style=\"margin:34px 0 0; font-size:20px;\">The /effort knob<\u002Fh2>\n        <p style=\"margin:10px 0 0; color:var(--muted); font-size:14.5px; line-height:1.6; max-width:640px;\">low · medium · high · xhigh · white-hot. It steers the whole route, not just a provider's reasoning parameter: higher effort biases toward stronger-benchmarked models only when the score gap is real. White-hot adds automatic workflow-script orchestration on top of maximum reasoning.<\u002Fp>\n        <sc-for list=\"{{ meshCmds }}\" as=\"c\" hint-placeholder-count=\"2\">\n          <div style=\"display:flex; align-items:center; gap:14px; font-family:'JetBrains Mono',monospace; font-size:13.5px; background:var(--panel); border:1px solid var(--border2); border-radius:8px; padding:12px 18px; margin-top:10px;\"><span style=\"color:var(--accent);\">$<\u002Fspan><span style=\"color:var(--code); flex:1; overflow-x:auto; white-space:pre;\">{{ c.cmd }}<\u002Fspan><span style=\"color:var(--dim); font-size:12px;\">{{ c.note }}<\u002Fspan><span style=\"color:var(--muted2); cursor:pointer;\" sc-camel-on-click=\"{{ c.pick }}\">{{ c.label }}<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display:{{ secBench }};\" data-screen-label=\"benchmarks\">\n        <h1 style=\"margin:0; font-size:34px; letter-spacing:-0.02em;\">Benchmarks<\u002Fh1>\n        <p style=\"margin:14px 0 0; color:var(--muted); font-size:16px; line-height:1.65; max-width:640px;\">The honest test of a harness: run the same model through Forge and through the raw vendor CLI, and let the official evaluator score both. The harness is the only variable.<\u002Fp>\n        <h2 style=\"margin:32px 0 0; font-size:20px;\">Method<\u002Fh2>\n        <p style=\"margin:10px 0 0; color:var(--muted); font-size:14.5px; line-height:1.6; max-width:640px;\">SWE-bench Lite (real GitHub bug fixes). The same <span style=\"font-family:'JetBrains Mono',monospace; font-size:13px;\">claude sonnet<\u002Fspan> runs through Forge's bridge vs. the raw claude CLI, scored by the official swebench Docker evaluator.<\u002Fp>\n        <div style=\"display:grid; grid-template-columns:1.4fr 1fr 1fr; margin-top:24px; font-size:14px; border:1px solid var(--border); border-radius:10px; overflow:hidden; max-width:560px;\">\n          <div style=\"padding:12px 16px; background:var(--panel2); color:var(--dim); font-family:'JetBrains Mono',monospace; font-size:11px;\">SAME SONNET MODEL<\u002Fdiv><div style=\"padding:12px 16px; background:var(--panel2); color:var(--dim); font-family:'JetBrains Mono',monospace; font-size:11px;\">BUGS FIXED<\u002Fdiv><div style=\"padding:12px 16px; background:var(--panel2); color:var(--dim); font-family:'JetBrains Mono',monospace; font-size:11px;\">TOKENS / FIX<\u002Fdiv>\n          <div style=\"padding:12px 16px; border-top:1px solid var(--border); color:var(--muted2);\">raw claude CLI<\u002Fdiv><div style=\"padding:12px 16px; border-top:1px solid var(--border); color:var(--muted2); font-family:'JetBrains Mono',monospace;\">4 / 10<\u002Fdiv><div style=\"padding:12px 16px; border-top:1px solid var(--border); color:var(--muted2); font-family:'JetBrains Mono',monospace;\">3.57M<\u002Fdiv>\n          <div style=\"padding:12px 16px; border-top:1px solid var(--border); color:var(--ink); font-weight:600;\">through Forge<\u002Fdiv><div style=\"padding:12px 16px; border-top:1px solid var(--border); color:var(--accent); font-family:'JetBrains Mono',monospace; font-weight:700;\">6 / 10<\u002Fdiv><div style=\"padding:12px 16px; border-top:1px solid var(--border); color:var(--accent); font-family:'JetBrains Mono',monospace; font-weight:700;\">2.83M<\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:16px 0 0; color:var(--muted); font-size:14.5px; line-height:1.6; max-width:640px;\">Forge strictly dominates: every bug the raw CLI fixed, Forge also fixed, plus two more, zero the other way, at ~21% lower token cost per fix. The larger N=20 run holds the same direction (11 vs 9). Total tokens are at parity: Forge does more work because it solves more.<\u002Fp>\n        <h2 style=\"margin:32px 0 0; font-size:20px;\">Why the gap exists<\u002Fh2>\n        <p style=\"margin:10px 0 0; color:var(--muted); font-size:14.5px; line-height:1.6; max-width:640px;\">Real models loop, write tool calls as prose that never execute, and claim \"done\" without checking. Forge's loop gates completion on tool-grounded evidence, recovers orphaned tool calls, and guards against doom loops; 324 conformance tests pin those behaviors.<\u002Fp>\n        <sc-for list=\"{{ benchCmds }}\" as=\"c\" hint-placeholder-count=\"1\">\n          <div style=\"display:flex; align-items:center; gap:14px; font-family:'JetBrains Mono',monospace; font-size:13.5px; background:var(--panel); border:1px solid var(--border2); border-radius:8px; padding:12px 18px; margin-top:18px;\"><span style=\"color:var(--accent);\">$<\u002Fspan><span style=\"color:var(--code); flex:1; overflow-x:auto; white-space:pre;\">{{ c.cmd }}<\u002Fspan><span style=\"color:var(--dim); font-size:12px;\">{{ c.note }}<\u002Fspan><span style=\"color:var(--muted2); cursor:pointer;\" sc-camel-on-click=\"{{ c.pick }}\">{{ c.label }}<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-for>\n        <p style=\"margin:14px 0 0; color:var(--dim); font-size:13px;\">Full method, the larger-N run, and an explicit \"where Forge does not win yet\" section: <a href=\"https://github.com/adulari/forge/blob/main/docs/harness/why-forge-is-a-better-harness.md\">why-forge-is-a-better-harness.md<\u002Fa><\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:{{ secBridge }};\" data-screen-label=\"subscription bridges\">\n        <h1 style=\"margin:0; font-size:34px; letter-spacing:-0.02em;\">Subscriptions &amp; OAuth<\u002Fh1>\n        <p style=\"margin:14px 0 0; color:var(--muted); font-size:16px; line-height:1.65; max-width:640px;\">Run the plan you already pay for through Forge and get mesh routing, failover, and the reliability layer on top. No other agent does this.<\u002Fp>\n        <h2 style=\"margin:32px 0 0; font-size:20px;\">Two ways in<\u002Fh2>\n        <div style=\"margin-top:16px; display:grid; grid-template-columns:max-content 1fr; gap:14px 22px; font-size:14.5px;\">\n          <span style=\"font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--accent); white-space:nowrap;\">native OAuth<\u002Fspan>\n          <span style=\"color:var(--muted); line-height:1.6;\">Codex (paste-redirect or RFC 8628 device flow) and Grok / xAI. Fully headless, state + PKCE verified, tokens in the OS keyring. Native model use, no CLI in the loop.<\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--warn); white-space:nowrap;\">CLI bridge<\u002Fspan>\n          <span style=\"color:var(--muted); line-height:1.6;\">Claude Code and Antigravity ban third-party OAuth credential use, so Forge drives their official CLI instead. Your plan still gets routing, conservation, and the completion gate.<\u002Fspan>\n        <\u002Fdiv>\n        <sc-for list=\"{{ bridgeCmds }}\" as=\"c\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex; align-items:center; gap:14px; font-family:'JetBrains Mono',monospace; font-size:13.5px; background:var(--panel); border:1px solid var(--border2); border-radius:8px; padding:12px 18px; margin-top:10px;\"><span style=\"color:var(--accent);\">$<\u002Fspan><span style=\"color:var(--code); flex:1; overflow-x:auto; white-space:pre;\">{{ c.cmd }}<\u002Fspan><span style=\"color:var(--dim); font-size:12px;\">{{ c.note }}<\u002Fspan><span style=\"color:var(--muted2); cursor:pointer;\" sc-camel-on-click=\"{{ c.pick }}\">{{ c.label }}<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-for>\n        <h2 style=\"margin:32px 0 0; font-size:20px;\">How it works<\u002Fh2>\n        <div style=\"margin-top:14px; display:flex; flex-direction:column; gap:12px; color:var(--muted); font-size:14.5px; line-height:1.6;\">\n          <div>A persistent bridge transport keeps Claude re-drives warm; CLIs without that support fall back to a safe one-process-per-turn path that never double-executes tools.<\u002Fdiv>\n          <div>Headless OAuth for Codex (paste-redirect or device flow) and xAI, with PKCE verification. Secrets live in the OS keyring.<\u002Fdiv>\n          <div>Subscription conservation spreads trivial and standard work onto free models so your metered quota is spent only where it matters. <span style=\"font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--code);\">credit_mode = \"strict\"<\u002Fspan> keeps routing free + subscription only.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:24px; border:1px solid var(--border-hot); background:var(--panel-hot); border-radius:10px; padding:16px 20px; color:var(--muted); font-size:14.5px; line-height:1.6;\">Proof this works: the same sonnet fixes 50% more SWE-bench bugs through Forge than through the raw CLI. See <span style=\"color:var(--accent); cursor:pointer;\" sc-camel-on-click=\"{{ goBench }}\">Benchmarks<\u002Fspan>.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:{{ secTui }};\" data-screen-label=\"tui and commands\">\n        <h1 style=\"margin:0; font-size:34px; letter-spacing:-0.02em;\">The TUI &amp; commands<\u002Fh1>\n        <p style=\"margin:14px 0 0; color:var(--muted); font-size:16px; line-height:1.65; max-width:640px;\">Full-screen by default: scrollable transcript, pinned panels, live progress, cost meter, context gauge. Use <span style=\"font-family:'JetBrains Mono',monospace; font-size:14px;\">--inline<\u002Fspan> for native scrollback, <span style=\"font-family:'JetBrains Mono',monospace; font-size:14px;\">--plain<\u002Fspan> for CI.<\u002Fp>\n        <h2 style=\"margin:32px 0 0; font-size:20px;\">Essential slash commands<\u002Fh2>\n        <div style=\"margin-top:16px; display:grid; grid-template-columns:max-content 1fr; gap:10px 22px; font-size:14px;\">\n          <sc-for list=\"{{ slashRows }}\" as=\"r\" hint-placeholder-count=\"12\">\n            <div style=\"display:contents;\">\n              <span style=\"font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--cy); white-space:nowrap;\">{{ r.cmd }}<\u002Fspan>\n              <span style=\"color:var(--muted2); line-height:1.55;\">{{ r.desc }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <h2 style=\"margin:34px 0 0; font-size:20px;\">Keyboard<\u002Fh2>\n        <div style=\"margin-top:16px; display:grid; grid-template-columns:max-content 1fr; gap:10px 22px; font-size:14px;\">\n          <sc-for list=\"{{ keyRows }}\" as=\"r\" hint-placeholder-count=\"8\">\n            <div style=\"display:contents;\">\n              <span style=\"font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--code); white-space:nowrap;\">{{ r.cmd }}<\u002Fspan>\n              <span style=\"color:var(--muted2); line-height:1.55;\">{{ r.desc }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <h2 style=\"margin:34px 0 0; font-size:20px;\">Statusline<\u002Fh2>\n        <p style=\"margin:10px 0 0; color:var(--muted); font-size:14.5px; line-height:1.6; max-width:640px;\">A row of widgets you can add, remove, or reorder live with <span style=\"font-family:'JetBrains Mono',monospace; font-size:13px;\">/statusline<\u002Fspan>, including shell-backed custom widgets on a refresh interval.<\u002Fp>\n        <div style=\"margin-top:12px; font-family:'JetBrains Mono',monospace; font-size:13px; line-height:1.9; color:var(--ink2); background:var(--panel); border:1px solid var(--border2); border-radius:8px; padding:16px 20px; overflow-x:auto; white-space:pre;\">[statusline]\nleft  = [\"model\", \"session_cost\", \"effort\", \"mode\"]\nright = [\"git_branch\", \"repo_name\", \"quota_claude\", \"mcp_status\"]<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:{{ secAuto }};\" data-screen-label=\"workflows and automation\">\n        <h1 style=\"margin:0; font-size:34px; letter-spacing:-0.02em;\">Workflows &amp; automation<\u002Fh1>\n        <p style=\"margin:14px 0 0; color:var(--muted); font-size:16px; line-height:1.65; max-width:640px;\">Fan work out, race models against each other, and let Forge work while you sleep.<\u002Fp>\n        <h2 style=\"margin:32px 0 0; font-size:20px;\">/workflow · scripted orchestration<\u002Fh2>\n        <p style=\"margin:10px 0 0; color:var(--muted); font-size:14.5px; line-height:1.6; max-width:640px;\">Sandboxed JS scripts compose <span style=\"font-family:'JetBrains Mono',monospace; font-size:13px;\">agent()<\u002Fspan>, <span style=\"font-family:'JetBrains Mono',monospace; font-size:13px;\">parallel()<\u002Fspan>, and <span style=\"font-family:'JetBrains Mono',monospace; font-size:13px;\">pipeline()<\u002Fspan> into phases of mesh-routed agents, rendered live in a dedicated animated dashboard. Save scripts and re-run them by name.<\u002Fp>\n        <h2 style=\"margin:30px 0 0; font-size:20px;\">/duel · the arena<\u002Fh2>\n        <p style=\"margin:10px 0 0; color:var(--muted); font-size:14.5px; line-height:1.6; max-width:640px;\">Race up to 3 distinct-provider models on the same task in parallel git worktrees, review, merge the winner. Recorded wins feed back into routing: <span style=\"font-family:'JetBrains Mono',monospace; font-size:13px;\">forge scoreboard<\u002Fspan> shows what your repo has taught the router.<\u002Fp>\n        <h2 style=\"margin:30px 0 0; font-size:20px;\">forge queue · overnight autopilot<\u002Fh2>\n        <p style=\"margin:10px 0 0; color:var(--muted); font-size:14.5px; line-height:1.6; max-width:640px;\">Queue tasks by day; drain them headless overnight, each in an isolated worktree, killed at its budget cap and optionally assay-gated. Wake up to review-ready autopilot branches and a morning digest.<\u002Fp>\n        <sc-for list=\"{{ autoCmds }}\" as=\"c\" hint-placeholder-count=\"5\">\n          <div style=\"display:flex; align-items:center; gap:14px; font-family:'JetBrains Mono',monospace; font-size:13.5px; background:var(--panel); border:1px solid var(--border2); border-radius:8px; padding:12px 18px; margin-top:10px;\"><span style=\"color:var(--accent);\">$<\u002Fspan><span style=\"color:var(--code); flex:1; overflow-x:auto; white-space:pre;\">{{ c.cmd }}<\u002Fspan><span style=\"color:var(--dim); font-size:12px;\">{{ c.note }}<\u002Fspan><span style=\"color:var(--muted2); cursor:pointer;\" sc-camel-on-click=\"{{ c.pick }}\">{{ c.label }}<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"margin-top:24px; border:1px solid var(--border-hot); background:var(--panel-hot); border-radius:10px; padding:16px 20px; color:var(--muted); font-size:14.5px; line-height:1.6;\"><span style=\"font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--code);\">forge schedule<\u002Fspan> registers recurring headless runs on native OS timers (systemd, launchd, Task Scheduler); point one at <span style=\"font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--code);\">forge queue run<\u002Fspan> for a nightly drain. Assay adds a parallel adversarial critic crew with a CI gate (<span style=\"font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--code);\">forge assay run --scope diff --fail-on high<\u002Fspan>).<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:{{ secIntel }};\" data-screen-label=\"code intelligence\">\n        <h1 style=\"margin:0; font-size:34px; letter-spacing:-0.02em;\">Code intelligence<\u002Fh1>\n        <p style=\"margin:14px 0 0; color:var(--muted); font-size:16px; line-height:1.65; max-width:640px;\">Context that's earned, not dumped: a queryable code graph, durable per-project memory, and per-line provenance for everything the agent writes.<\u002Fp>\n        <h2 style=\"margin:32px 0 0; font-size:20px;\">Lattice · the code graph<\u002Fh2>\n        <p style=\"margin:10px 0 0; color:var(--muted); font-size:14.5px; line-height:1.6; max-width:640px;\">A tree-sitter symbol graph across 9 languages with blast radius, call chains, and semantic embeddings, auto-injected before each turn and incremental by content hash.<\u002Fp>\n        <sc-for list=\"{{ latCmds }}\" as=\"c\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex; align-items:center; gap:14px; font-family:'JetBrains Mono',monospace; font-size:13.5px; background:var(--panel); border:1px solid var(--border2); border-radius:8px; padding:12px 18px; margin-top:10px;\"><span style=\"color:var(--accent);\">$<\u002Fspan><span style=\"color:var(--code); flex:1; overflow-x:auto; white-space:pre;\">{{ c.cmd }}<\u002Fspan><span style=\"color:var(--dim); font-size:12px;\">{{ c.note }}<\u002Fspan><span style=\"color:var(--muted2); cursor:pointer;\" sc-camel-on-click=\"{{ c.pick }}\">{{ c.label }}<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-for>\n        <h2 style=\"margin:32px 0 0; font-size:20px;\">Memory<\u002Fh2>\n        <p style=\"margin:10px 0 0; color:var(--muted); font-size:14.5px; line-height:1.6; max-width:640px;\">Typed, durable facts per project, auto-captured at turn end and relevance-ranked back into context next session: only the relevant ones, not a dump. <span style=\"font-family:'JetBrains Mono',monospace; font-size:13px;\">/remember<\u002Fspan>, <span style=\"font-family:'JetBrains Mono',monospace; font-size:13px;\">/memories<\u002Fspan>, <span style=\"font-family:'JetBrains Mono',monospace; font-size:13px;\">forge memory add \"use 4-space indent\" --kind decision<\u002Fspan>.<\u002Fp>\n        <h2 style=\"margin:32px 0 0; font-size:20px;\">Provenance · blame, replay, fork<\u002Fh2>\n        <sc-for list=\"{{ provCmds }}\" as=\"c\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex; align-items:center; gap:14px; font-family:'JetBrains Mono',monospace; font-size:13.5px; background:var(--panel); border:1px solid var(--border2); border-radius:8px; padding:12px 18px; margin-top:10px;\"><span style=\"color:var(--accent);\">$<\u002Fspan><span style=\"color:var(--code); flex:1; overflow-x:auto; white-space:pre;\">{{ c.cmd }}<\u002Fspan><span style=\"color:var(--dim); font-size:12px;\">{{ c.note }}<\u002Fspan><span style=\"color:var(--muted2); cursor:pointer;\" sc-camel-on-click=\"{{ c.pick }}\">{{ c.label }}<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display:{{ secApps }};\" data-screen-label=\"apps and remote\">\n        <h1 style=\"margin:0; font-size:34px; letter-spacing:-0.02em;\">Apps &amp; remote control<\u002Fh1>\n        <p style=\"margin:14px 0 0; color:var(--muted); font-size:16px; line-height:1.65; max-width:640px;\">Every surface drives the same sessions, permissions, plans, and audit trail: terminal, desktop app, phone, or any OpenAI SDK.<\u002Fp>\n        <h2 style=\"margin:32px 0 0; font-size:20px;\">forge serve · the fleet daemon<\u002Fh2>\n        <p style=\"margin:10px 0 0; color:var(--muted); font-size:14.5px; line-height:1.6; max-width:640px;\">One headless process, any number of sessions, all driveable from a phone or browser at a stable origin (default port 7420). Sessions survive disconnects; reconnects replay what you missed. Push notifications carry Allow/Deny actions you can answer from the lock screen.<\u002Fp>\n        <sc-for list=\"{{ appCmds }}\" as=\"c\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex; align-items:center; gap:14px; font-family:'JetBrains Mono',monospace; font-size:13.5px; background:var(--panel); border:1px solid var(--border2); border-radius:8px; padding:12px 18px; margin-top:10px;\"><span style=\"color:var(--accent);\">$<\u002Fspan><span style=\"color:var(--code); flex:1; overflow-x:auto; white-space:pre;\">{{ c.cmd }}<\u002Fspan><span style=\"color:var(--dim); font-size:12px;\">{{ c.note }}<\u002Fspan><span style=\"color:var(--muted2); cursor:pointer;\" sc-camel-on-click=\"{{ c.pick }}\">{{ c.label }}<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-for>\n        <h2 style=\"margin:32px 0 0; font-size:20px;\">Desktop &amp; mobile<\u002Fh2>\n        <p style=\"margin:10px 0 0; color:var(--muted); font-size:14.5px; line-height:1.6; max-width:640px;\">The Tauri desktop app auto-discovers your Forge install and checks signed updates. The companion app (one TypeScript codebase for iOS, Android, Web, Windows, macOS, Linux) ships fleet, inbox, plans, review, replay, usage, models, and configuration as native screens, plus voice capture and iOS Live Activities. Fastest mobile install: open the forge serve URL and Add to Home Screen.<\u002Fp>\n        <h2 style=\"margin:32px 0 0; font-size:20px;\">forge api · OpenAI-compatible server<\u002Fh2>\n        <p style=\"margin:10px 0 0; color:var(--muted); font-size:14.5px; line-height:1.6; max-width:640px;\">Point any OpenAI SDK at <span style=\"font-family:'JetBrains Mono',monospace; font-size:13px;\">http://127.0.0.1:8787/v1<\u002Fspan> and use model <span style=\"font-family:'JetBrains Mono',monospace; font-size:13px;\">auto<\u002Fspan> to route each request through the mesh: streaming, tool calls, JSON schemas, and routing/cost metadata included.<\u002Fp>\n        <h2 style=\"margin:32px 0 0; font-size:20px;\">MCP &amp; skills<\u002Fh2>\n        <p style=\"margin:10px 0 0; color:var(--muted); font-size:14.5px; line-height:1.6; max-width:640px;\">MCP client (stdio + HTTP/SSE, OAuth) and MCP server in one. Skills and commands are Claude Code format compatible: <span style=\"font-family:'JetBrains Mono',monospace; font-size:13px;\">forge import claude<\u002Fspan> migrates your existing setup, <span style=\"font-family:'JetBrains Mono',monospace; font-size:13px;\">forge skill install owner/repo<\u002Fspan> pulls from GitHub, and <span style=\"font-family:'JetBrains Mono',monospace; font-size:13px;\">forge migrate<\u002Fspan> packs a whole install to move machines.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:{{ secSafety }};\" data-screen-label=\"safety and config\">\n        <h1 style=\"margin:0; font-size:34px; letter-spacing:-0.02em;\">Safety &amp; configuration<\u002Fh1>\n        <p style=\"margin:14px 0 0; color:var(--muted); font-size:16px; line-height:1.65; max-width:640px;\">Explicit, reviewable, and reversible. Every tool call, routing decision, and permission outcome lands in the audit trail.<\u002Fp>\n        <h2 style=\"margin:32px 0 0; font-size:20px;\">The four tempers<\u002Fh2>\n        <div style=\"margin-top:16px; display:grid; grid-template-columns:max-content 1fr; gap:10px 22px; font-size:14px;\">\n          <sc-for list=\"{{ temperRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n            <div style=\"display:contents;\">\n              <span style=\"font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--accent); white-space:nowrap;\">{{ r.cmd }}<\u002Fspan>\n              <span style=\"color:var(--muted2); line-height:1.55;\">{{ r.desc }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"margin:16px 0 0; color:var(--muted); font-size:14.5px; line-height:1.6; max-width:640px;\">An unoverridable denylist blocks catastrophic ops (rm -rf /, .env reads, pipe-to-sh) in every temper. Diff preview before every write, shadow snapshots, <span style=\"font-family:'JetBrains Mono',monospace; font-size:13px;\">/undo<\u002Fspan> with file restore, per-turn checkpoints, and optional Linux Landlock confinement.<\u002Fp>\n        <h2 style=\"margin:32px 0 0; font-size:20px;\">Config layers<\u002Fh2>\n        <div style=\"margin-top:12px; font-family:'JetBrains Mono',monospace; font-size:13px; line-height:1.9; color:var(--ink2); background:var(--panel); border:1px solid var(--border2); border-radius:8px; padding:16px 20px; overflow-x:auto; white-space:pre;\">~/.config/forge/config.toml   <span style=\"color:var(--dim);\"># user<\u002Fspan>\n./.forge/config.toml          <span style=\"color:var(--dim);\"># project<\u002Fspan>\n./.forge/AGENTS.md            <span style=\"color:var(--dim);\"># project memory (/init writes it)<\u002Fspan>\nFORGE_*                       <span style=\"color:var(--dim);\"># env override<\u002Fspan>\nOS keyring                    <span style=\"color:var(--dim);\"># API keys (forge auth)<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:12px 0 0; color:var(--muted); font-size:14.5px; line-height:1.6; max-width:640px;\">Everything is editable in-app with <span style=\"font-family:'JetBrains Mono',monospace; font-size:13px;\">/config<\u002Fspan>: fuzzy-search any setting, permission rules, keybinds, hooks, statusline. Changes validate and persist.<\u002Fp>\n        <h2 style=\"margin:32px 0 0; font-size:20px;\">Telemetry<\u002Fh2>\n        <p style=\"margin:10px 0 0; color:var(--muted); font-size:14.5px; line-height:1.6; max-width:640px;\">Anonymous counters only: no prompts, responses, file contents, paths, repo names, keys, or stable identifiers. It never blocks Forge, and one line disables it everywhere:<\u002Fp>\n        <div style=\"margin-top:12px; font-family:'JetBrains Mono',monospace; font-size:13px; line-height:1.9; color:var(--ink2); background:var(--panel); border:1px solid var(--border2); border-radius:8px; padding:16px 20px; white-space:pre;\">[telemetry]\nenabled = false<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex; justify-content:space-between; gap:16px; margin-top:56px; border-top:1px solid var(--border); padding-top:22px;\">\n        <span style=\"color:{{ prevColor }}; cursor:pointer; font-size:14.5px;\" sc-camel-on-click=\"{{ goPrev }}\">{{ prevLabel }}<\u002Fspan>\n        <span style=\"color:var(--accent); cursor:pointer; font-size:14.5px; text-align:right;\" sc-camel-on-click=\"{{ goNext }}\">{{ nextLabel }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fmain>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { sec: 'quickstart', q: '', copied: '', theme: 'dark' };\n  componentDidMount() {\n    try { if (localStorage.getItem('forge-theme') === 'light') this.setState({ theme: 'light' }); } catch (e) {}\n    const h = (location.hash || '').replace('#', '');\n    if (this.SECTIONS.some(s => s.id === h)) this.setState({ sec: h });\n    this._kd = (e) => {\n      if (e.key === '/' && document.activeElement && document.activeElement.tagName !== 'INPUT') {\n        e.preventDefault();\n        const inp = document.querySelector('input');\n        if (inp) inp.focus();\n      }\n    };\n    window.addEventListener('keydown', this._kd);\n  }\n  componentWillUnmount() { window.removeEventListener('keydown', this._kd); clearTimeout(this._c); }\n  SECTIONS = [\n    { id: 'quickstart', label: 'Quickstart', group: 'Getting started', kw: 'install curl setup chat mock tour' },\n    { id: 'free', label: 'Free providers', group: 'Getting started', kw: 'groq nvidia cerebras gemini keys $0 stack round-robin' },\n    { id: 'mesh', label: 'Mesh routing', group: 'The Mesh', kw: 'tiers failover budget credit strict effort white-hot 429' },\n    { id: 'bench', label: 'Benchmarks', group: 'The Mesh', kw: 'swe-bench proof harness sonnet 50% tokens' },\n    { id: 'bridge', label: 'Subscriptions & OAuth', group: 'The Mesh', kw: 'claude codex antigravity grok xai max pro plan oauth pkce device flow bridge conserve' },\n    { id: 'tui', label: 'TUI & commands', group: 'Using Forge', kw: 'slash keyboard shortcuts statusline plan execute compact' },\n    { id: 'auto', label: 'Workflows & automation', group: 'Using Forge', kw: 'workflow duel queue schedule assay loop goal autopilot' },\n    { id: 'intel', label: 'Code intelligence', group: 'Using Forge', kw: 'lattice memory blame replay fork provenance graph' },\n    { id: 'apps', label: 'Apps & remote', group: 'Platform', kw: 'serve desktop mobile pwa push api openai mcp skills migrate' },\n    { id: 'safety', label: 'Safety & config', group: 'Platform', kw: 'permissions tempers denylist undo config toml telemetry landlock' },\n  ];\n  mk(list) {\n    return list.map(([cmd, note]) => ({\n      cmd, note,\n      label: this.state.copied === cmd ? '✓' : '⧉',\n      pick: () => {\n        navigator.clipboard && navigator.clipboard.writeText(cmd);\n        this.setState({ copied: cmd });\n        clearTimeout(this._c);\n        this._c = setTimeout(() => this.setState({ copied: '' }), 1800);\n      },\n    }));\n  }\n  go(id) { location.hash = id; this.setState({ sec: id }); const m = document.querySelector('main'); if (m) m.parentElement.parentElement.scrollTop = 0; window.scrollTo(0, 0); }\n  renderVals() {\n    const st = this.state;\n    const q = st.q.trim().toLowerCase();\n    const filtered = this.SECTIONS.filter(s => !q || (s.label + ' ' + s.kw).toLowerCase().includes(q));\n    const navItems = [];\n    let lastGroup = '';\n    filtered.forEach(s => {\n      if (s.group !== lastGroup) {\n        lastGroup = s.group;\n        navItems.push({ label: s.group, kind: 'h', font: \"'JetBrains Mono',monospace\", size: 10.5, color: 'var(--dim)', bg: 'transparent', weight: 700, pad: '4px 12px', mt: navItems.length ? 22 : 0, cursor: 'default', edge: 'transparent', pick: () => {} });\n      }\n      const active = st.sec === s.id;\n      navItems.push({\n        label: s.label, kind: 'i',\n        font: \"'Geist',sans-serif\", size: 14,\n        color: active ? 'var(--accent)' : 'var(--muted)',\n        bg: active ? 'rgba(255,138,48,.10)' : 'transparent',\n        weight: active ? 600 : 400,\n        pad: '8px 12px', mt: 2, cursor: 'pointer',\n        edge: active ? 'var(--accent)' : 'transparent',\n        pick: () => this.go(s.id),\n      });\n    });\n    const secVals = {};\n    this.SECTIONS.forEach(s => { secVals['sec' + s.id.charAt(0).toUpperCase() + s.id.slice(1)] = st.sec === s.id ? 'block' : 'none'; });\n    const idx = this.SECTIONS.findIndex(s => s.id === st.sec);\n    const prev = this.SECTIONS[idx - 1], next = this.SECTIONS[idx + 1];\n    return {\n      q: st.q,\n      setQ: (e) => this.setState({ q: e.target.value }),\n      theme: st.theme,\n      themeGlyph: st.theme === 'light' ? '☾' : '☀',\n      toggleTheme: () => {\n        const t = st.theme === 'light' ? 'dark' : 'light';\n        try { localStorage.setItem('forge-theme', t); } catch (e) {}\n        this.setState({ theme: t });\n      },\n      navItems,\n      ...secVals,\n      goFree: () => this.go('free'),\n      goBench: () => this.go('bench'),\n      goPrev: () => prev && this.go(prev.id),\n      goNext: () => next && this.go(next.id),\n      prevLabel: prev ? '← ' + prev.label : '',\n      nextLabel: next ? next.label + ' →' : '',\n      prevColor: prev ? 'var(--accent)' : 'transparent',\n      qsInstall: this.mk([['curl -fsSL forge.adulari.dev/install.sh | sh', 'linux · macos']]),\n      qsSetup: this.mk([\n        ['forge setup', 'guided: keys + plans + local LLM'],\n        ['forge auth groq', 'or add any key directly'],\n      ]),\n      qsWork: this.mk([\n        ['forge chat', 'full-screen TUI'],\n        ['forge run \"add pagination to the user list\"', 'one-shot task'],\n        ['forge models', 'catalog + auto-pick per tier'],\n        ['forge tour --demo', 'zero keys, offline'],\n      ]),\n      freeRows: [\n        { name: 'Groq', models: 'llama-3.3-70b · qwen3-32b · gpt-oss-120b', limits: '30 RPM · 1K/day', connect: 'forge auth groq' },\n        { name: 'NVIDIA', models: 'deepseek-r1 · llama-405b · 100+ models', limits: '40 RPM', connect: 'forge auth nvidia' },\n        { name: 'Cerebras', models: 'qwen-3-coder-480b · gpt-oss-120b', limits: '30 RPM · 14.4K/day', connect: 'forge auth cerebras' },\n        { name: 'Gemini', models: 'gemini flash (1M context) · gemma', limits: '15 RPM · 1.5K/day', connect: 'forge auth gemini' },\n        { name: 'SambaNova', models: 'deepseek-v3.1 · llama-4 maverick', limits: '20 RPM', connect: 'forge auth sambanova' },\n        { name: 'Mistral', models: 'mistral large 3 · codestral', limits: '1 RPS · 500K TPM', connect: 'forge auth mistral' },\n        { name: 'OpenRouter', models: 'rotating :free frontier models', limits: '20 RPM · 200/day', connect: 'forge auth openrouter' },\n        { name: 'Cohere', models: 'command A (218B) · command R+', limits: '20 RPM · 1K/mo', connect: 'forge auth cohere' },\n      ],\n      freeCmds: this.mk([\n        ['forge auth groq', 'add a key'],\n        ['forge auth groq', 'again: Forge rotates across both'],\n        ['forge auth groq --list', 'masked key overview'],\n      ]),\n      meshCmds: this.mk([\n        ['forge mesh \"add OpenTelemetry tracing\"', 'explain how a task would route'],\n        ['forge models --probe', 'live health-check the catalog'],\n      ]),\n      benchCmds: this.mk([['forge bench swe', 'reproduce with the official evaluator']]),\n      bridgeCmds: this.mk([\n        ['forge auth codex', 'native OAuth: paste-redirect or device flow'],\n        ['forge auth xai', 'native OAuth: Grok, PKCE-verified'],\n        ['forge run --model claude-cli::sonnet \"fix the flaky auth test\"', 'Claude plan via the CLI bridge'],\n        ['forge doctor', 'verify bridges + providers'],\n      ]),\n      slashRows: [\n        { cmd: '/plan · /execute', desc: 'investigate read-only, propose a plan, then approve and run it' },\n        { cmd: '/orchestrate', desc: 'route a task through skills, subagents, MCP, web, Lattice, or direct' },\n        { cmd: '/workflow', desc: 'author or run a saved orchestration script' },\n        { cmd: '/duel', desc: 'race models in parallel worktrees, merge the winner' },\n        { cmd: '/mesh · /usage', desc: 'routing inspector · spend and token usage' },\n        { cmd: '/model · /effort · /mode', desc: 'pin a model · set the route knob · switch temper' },\n        { cmd: '/undo · /checkpoint', desc: 'revert last turn · save and rewind session state' },\n        { cmd: '/compact', desc: 'summarize older context (auto-triggers at 80% gauge)' },\n        { cmd: '/remember · /memories', desc: 'save a durable fact · list what Forge knows' },\n        { cmd: '/voice', desc: 'local Whisper dictation into the draft, never auto-sends' },\n        { cmd: '/pr', desc: 'branch + commit + open a PR with a provenance-rich body' },\n        { cmd: '/remote', desc: 'drive this session from a phone or browser' },\n        { cmd: '/config · /statusline', desc: 'edit any setting live · customize the status row' },\n        { cmd: '/', desc: 'fuzzy command palette over commands and skills' },\n      ],\n      keyRows: [\n        { cmd: 'Shift+Tab', desc: 'cycle temper (Read-only → Ask → Auto-edit → Full)' },\n        { cmd: 'Ctrl+K', desc: 'mid-turn: abort + retry the same prompt on the next-ranked model' },\n        { cmd: 'Ctrl+↑ / Ctrl+↓', desc: 'bias the routing tier up or down, re-running if mid-turn' },\n        { cmd: 'Ctrl+O', desc: 'activity viewer: main chat + subagents + critics' },\n        { cmd: 'y / n / a', desc: 'allow, deny, or always-allow a permission prompt' },\n        { cmd: 'Alt+M · Alt+E', desc: 'model picker · cycle effort' },\n        { cmd: 'Ctrl+Z · Ctrl+S', desc: 'undo last write · checkpoint' },\n        { cmd: 'F1', desc: 'full keybind reference (editable with Ctrl+,)' },\n      ],\n      autoCmds: this.mk([\n        ['/workflow run nightly-refactor', 'run a saved script (in chat)'],\n        ['/duel add pagination to the /users endpoint', 'race 3 models (in chat)'],\n        ['forge queue add \"migrate the auth module\" --budget 2.50', 'queue with a cost cap'],\n        ['forge queue run --gate high', 'drain: isolated worktree per task'],\n        ['forge schedule add \"weekly deps audit\" --cron \"Mon 08:00\"', 'native OS timer'],\n        ['forge scoreboard', 'per-repo model wins + routing boost'],\n      ]),\n      latCmds: this.mk([\n        ['forge lattice update .', 'index, incremental by content hash'],\n        ['forge lattice impact \"UserRepository\"', 'blast radius: what depends on it'],\n        ['forge lattice path \"main\" \"persist\"', 'shortest call chain A → B'],\n        ['forge lattice why \"authenticate\"', 'git provenance: who last changed it'],\n      ]),\n      provCmds: this.mk([\n        ['forge blame src/auth.rs --line 42', 'which model, session, prompt wrote it'],\n        ['forge replay abc123 def456', 'aligned turn-by-turn session diff'],\n        ['forge fork abc123 --turn 2 --rerun', 'hold prefix fixed, re-ask one turn'],\n        ['forge tree', 'fork families and lineage'],\n      ]),\n      appCmds: this.mk([\n        ['forge serve', 'LAN daemon + QR pairing'],\n        ['forge serve --anywhere', 'public tunnel via cloudflared/ngrok'],\n        ['forge service install --local', 'start at login, restart on failure'],\n        ['forge api --port 8787', 'OpenAI-compatible /v1 behind the mesh'],\n      ]),\n      temperRows: [\n        { cmd: 'Read-only', desc: 'investigate only; no writes, no shell' },\n        { cmd: 'Ask', desc: 'every write and command prompts (the default)' },\n        { cmd: 'Auto-edit', desc: 'file writes and shell auto-approved; the denylist still blocks catastrophic ops' },\n        { cmd: 'Full', desc: 'no prompts; for isolated worktrees and CI' },\n      ],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
