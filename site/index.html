  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

>&nbsp;&nbsp;[a]lways<\u002Fspan><span style=\"color:#F35C5C; font-weight:700;\">&nbsp;&nbsp;[n]o<\u002Fspan><span style=\"color:var(--dim);\">&nbsp;&nbsp;Esc cancel<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:12px 20px 14px;\">\n          <div style=\"position:relative; border:1px solid {{ composerTone }}; border-radius:8px; padding:10px 14px; font-family:'JetBrains Mono',monospace; font-size:13.5px; min-height:20px;\">\n            <span style=\"position:absolute; top:-9px; left:12px; background:#0C0E16; padding:0 6px; color:{{ composerTone }}; font-weight:700; font-size:12px;\">{{ composerTitle }}<\u002Fspan>\n            <span style=\"color:var(--accent); font-weight:700;\">› <\u002Fspan><span style=\"color:var(--ink2);\">{{ typedText }}<\u002Fspan><span style=\"display:inline-block; width:8px; height:15px; background:#FF8A30; vertical-align:middle; animation:blink 1.1s step-end infinite;\"><\u002Fspan><span style=\"color:var(--dim);\">{{ ghostText }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; align-items:center; flex-wrap:wrap; padding:8px 20px; background:#0E0F15; border-top:1px solid #1E2233; font-family:'JetBrains Mono',monospace; font-size:12px;\">\n          <span style=\"display:{{ spinDisplay }}; color:#52A2FF; font-weight:700;\">{{ spinGlyph }} working<span style=\"color:#262A3E;\">&nbsp;&nbsp;│&nbsp;&nbsp;<\u002Fspan><\u002Fspan>\n          <span style=\"color:var(--dim);\">{{ slTier }}<\u002Fspan>\n          <span style=\"color:#52A2FF; font-weight:700;\">{{ slModel }}<\u002Fspan>\n          <span style=\"color:#262A3E;\">&nbsp;&nbsp;│&nbsp;&nbsp;<\u002Fspan>\n          <span style=\"color:var(--green); font-weight:700;\">◈ {{ slCost }}<\u002Fspan>\n          <span style=\"color:#262A3E;\">&nbsp;&nbsp;│&nbsp;&nbsp;<\u002Fspan>\n          <span style=\"color:var(--gold);\">✦ white-hot<\u002Fspan>\n          <span style=\"color:#262A3E;\">&nbsp;&nbsp;│&nbsp;&nbsp;<\u002Fspan>\n          <span style=\"color:var(--green);\">◆ auto-edit<\u002Fspan>\n          <span style=\"margin-left:auto; color:var(--muted2);\">⎇ main<span style=\"color:#262A3E;\">&nbsp;&nbsp;│&nbsp;&nbsp;<\u002Fspan>my-api<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:20px auto 0; text-align:center; color:var(--dim); font-size:14px; max-width:660px;\">Four real screens on loop: a chat turn that fails over mid-turn, a <span style=\"font-family:'JetBrains Mono',monospace; color:var(--cy);\">/workflow<\u002Fspan> fan-out, local Whisper <span style=\"font-family:'JetBrains Mono',monospace; color:var(--cy);\">/voice<\u002Fspan> input, and the <span style=\"font-family:'JetBrains Mono',monospace; color:var(--cy);\">/mesh<\u002Fspan> routing inspector. Click the tabs to switch.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- MESH -->\n  <section id=\"mesh\" data-screen-label=\"the mesh\" style=\"padding:clamp(56px,9vw,96px) clamp(20px,5vw,64px); border-top:1px solid var(--border); background:radial-gradient(900px 400px at 12% 0%, rgba(255,96,32,.07), transparent 60%);\">\n    <div style=\"max-width:1060px; margin:0 auto; animation:secIn .9s cubic-bezier(.16,1,.3,1) both; animation-timeline:view(); animation-range:entry 0% entry 35%;\">\n      <h2 style=\"margin:0; font-size:clamp(32px,4.8vw,46px); font-weight:700; letter-spacing:-0.02em; max-width:700px; text-wrap:balance;\">The Mesh. You don't pick a model, <span style=\"color:var(--accent);\">you connect providers.<\u002Fspan><\u002Fh2>\n      <p style=\"margin:20px 0 0; color:var(--muted); font-size:18px; line-height:1.6; max-width:660px;\">Every task is classified into a tier, then routed to the cheapest model that meets the bar: benchmark-ranked against real Artificial Analysis intelligence and coding scores.<\u002Fp>\n      <div style=\"display:flex; flex-direction:column; gap:14px; margin-top:52px;\">\n        <div style=\"display:grid; grid-template-columns:150px 1fr 110px 1fr; gap:0 20px; align-items:center; border:1px solid var(--border); border-radius:10px; padding:20px 26px; background:var(--panel); transition:transform .25s, border-color .25s;\" style-hover=\"transform:translateY(-3px); border-color:var(--border-hot);\">\n          <span style=\"font-family:'JetBrains Mono',monospace; font-size:14px; color:var(--gold); font-weight:700;\">trivial<\u002Fspan>\n          <span style=\"color:var(--muted2); font-size:15px;\">\"rename this variable everywhere\"<\u002Fspan>\n          <div style=\"height:2px; border-radius:2px; background:linear-gradient(90deg, transparent, #FFD040, transparent); background-size:200% 100%; animation:flow 2.4s linear infinite;\"><\u002Fdiv>\n          <span style=\"font-family:'JetBrains Mono',monospace; font-size:14px; color:var(--ink);\">groq::llama-3.3-70b <span style=\"color:var(--cy);\">free<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:150px 1fr 110px 1fr; gap:0 20px; align-items:center; border:1px solid var(--border); border-radius:10px; padding:20px 26px; background:var(--panel); transition:transform .25s, border-color .25s;\" style-hover=\"transform:translateY(-3px); border-color:var(--border-hot);\">\n          <span style=\"font-family:'JetBrains Mono',monospace; font-size:14px; color:var(--o2); font-weight:700;\">standard<\u002Fspan>\n          <span style=\"color:var(--muted2); font-size:15px;\">\"refactor auth middleware across 6 files\"<\u002Fspan>\n          <div style=\"height:2px; border-radius:2px; background:linear-gradient(90deg, transparent, #FF9828, transparent); background-size:200% 100%; animation:flow 2.4s .5s linear infinite;\"><\u002Fdiv>\n          <span style=\"font-family:'JetBrains Mono',monospace; font-size:14px; color:var(--ink);\">nvidia::deepseek-r1 <span style=\"color:var(--cy);\">free<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:150px 1fr 110px 1fr; gap:0 20px; align-items:center; border:1px solid var(--border-hot); border-radius:10px; padding:20px 26px; background:var(--panel-hot); transition:transform .25s, border-color .25s;\" style-hover=\"transform:translateY(-3px); border-color:var(--accent);\">\n          <span style=\"font-family:'JetBrains Mono',monospace; font-size:14px; color:var(--o3); font-weight:700;\">complex<\u002Fspan>\n          <span style=\"color:var(--muted2); font-size:15px;\">\"design and add OpenTelemetry tracing\"<\u002Fspan>\n          <div style=\"height:2px; border-radius:2px; background:linear-gradient(90deg, transparent, #FF6020, transparent); background-size:200% 100%; animation:flow 2.4s 1s linear infinite;\"><\u002Fdiv>\n          <span style=\"font-family:'JetBrains Mono',monospace; font-size:14px; color:var(--ink);\">anthropic::claude-opus <span style=\"color:var(--accent);\">frontier<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:36px; margin-top:56px;\">\n        <div><div style=\"color:var(--ink); font-weight:600; font-size:16px;\">Reset-aware failover<\u002Fdiv><p style=\"margin:8px 0 0; color:var(--muted2); font-size:14.5px; line-height:1.6;\">A per-minute 429 is waited out, not downgraded. Real outages fail over down the whole ranked catalog, across providers.<\u002Fp><\u002Fdiv>\n        <div><div style=\"color:var(--ink); font-weight:600; font-size:16px;\">Subscription conservation<\u002Fdiv><p style=\"margin:8px 0 0; color:var(--muted2); font-size:14.5px; line-height:1.6;\">Spreads load onto free frontier models so your metered Claude/Codex quota is spent only where it matters.<\u002Fp><\u002Fdiv>\n        <div><div style=\"color:var(--ink); font-weight:600; font-size:16px;\">Key stacking<\u002Fdiv><p style=\"margin:8px 0 0; color:var(--muted2); font-size:14.5px; line-height:1.6;\">Add multiple keys per provider and Forge round-robins across them, multiplying free-tier rate limits.<\u002Fp><\u002Fdiv>\n        <div><div style=\"color:var(--ink); font-weight:600; font-size:16px;\">Explainable routing<\u002Fdiv><p style=\"margin:8px 0 0; color:var(--muted2); font-size:14.5px; line-height:1.6;\">Inspect any decision live with <span style=\"font-family:'JetBrains Mono',monospace; color:var(--cy);\">/mesh<\u002Fspan>: exactly why a prompt routed where it did.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- EFFORT -->\n  <section data-screen-label=\"effort ramp\" style=\"padding:clamp(56px,9vw,96px) clamp(20px,5vw,64px); border-top:1px solid var(--border);\">\n    <div style=\"max-width:860px; margin:0 auto; animation:secIn .9s cubic-bezier(.16,1,.3,1) both; animation-timeline:view(); animation-range:entry 0% entry 35%;\">\n      <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:24px;\">\n        <h2 style=\"margin:0; font-size:clamp(30px,4.2vw,40px); font-weight:700; letter-spacing:-0.02em;\">One knob steers the whole route.<\u002Fh2>\n        <span style=\"font-family:'JetBrains Mono',monospace; font-size:15px; color:{{ effortColor }}; font-weight:700;\">/effort {{ effortName }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex; gap:6px; margin-top:32px; height:44px;\">\n        <sc-for list=\"{{ effortStops }}\" as=\"stop\" hint-placeholder-count=\"5\">\n          <div style=\"flex:1; border-radius:5px; background:{{ stop.bg }}; opacity:{{ stop.op }}; cursor:pointer; box-shadow:{{ stop.glow }}; transition:opacity .25s, box-shadow .25s, transform .2s;\" style-hover=\"transform:scaleY(1.12);\" sc-camel-on-click=\"{{ stop.pick }}\"><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex; gap:6px; margin-top:12px; font-family:'JetBrains Mono',monospace; font-size:12.5px;\">\n        <sc-for list=\"{{ effortStops }}\" as=\"stop\" hint-placeholder-count=\"5\">\n          <span style=\"flex:1; color:{{ stop.labelColor }}; cursor:pointer;\" sc-camel-on-click=\"{{ stop.pick }}\">{{ stop.name }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p style=\"margin:26px 0 0; color:var(--muted); font-size:17px; line-height:1.6; min-height:54px; max-width:640px;\">{{ effortDesc }}<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- PROOF -->\n  <section id=\"proof\" data-screen-label=\"benchmark proof\" style=\"padding:clamp(56px,9vw,96px) clamp(20px,5vw,64px); border-top:1px solid var(--border); background:radial-gradient(800px 400px at 88% 10%, rgba(255,96,32,.07), transparent 60%);\">\n    <div style=\"max-width:1060px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fit, minmax(340px, 1fr)); gap:clamp(36px,6vw,80px); align-items:center; animation:secIn .9s cubic-bezier(.16,1,.3,1) both; animation-timeline:view(); animation-range:entry 0% entry 35%;\">\n      <div>\n        <h2 style=\"margin:0; font-size:clamp(32px,4.8vw,46px); font-weight:700; letter-spacing:-0.02em; text-wrap:balance;\">Same model. <span style=\"color:var(--accent);\">50% more bugs fixed.<\u002Fspan><\u002Fh2>\n        <p style=\"margin:22px 0 0; color:var(--muted); font-size:17px; line-height:1.65;\">The honest test of a harness: run the same <span style=\"font-family:'JetBrains Mono',monospace; font-size:15px; color:var(--ink);\">claude sonnet<\u002Fspan> through Forge vs. the raw CLI on SWE-bench Lite, scored by the official Docker evaluator. The harness is the only difference.<\u002Fp>\n        <p style=\"margin:16px 0 0; color:var(--muted2); font-size:15px; line-height:1.65;\">Strictly dominates: every bug the raw CLI fixed, Forge fixed too, plus two more, at ~21% lower token cost per fix. Reproducible with <span style=\"font-family:'JetBrains Mono',monospace; font-size:13.5px; color:var(--cy);\">forge bench swe<\u002Fspan>.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--dim); margin-bottom:20px;\">SWE-BENCH LITE · BUGS FIXED<\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:130px 1fr 70px; gap:16px 18px; align-items:center;\">\n          <span style=\"color:var(--muted2); font-size:15px;\">raw CLI<\u002Fspan>\n          <div style=\"height:38px; background:var(--track); border-radius:5px; overflow:hidden;\"><div style=\"width:40%; height:100%; background:var(--bar); transform-origin:left; animation:barGrow 1.2s cubic-bezier(.16,1,.3,1) both;\"><\u002Fdiv><\u002Fdiv>\n          <span style=\"font-family:'JetBrains Mono',monospace; color:var(--muted2); font-size:15px;\">4/10<\u002Fspan>\n          <span style=\"color:var(--ink); font-size:15px; font-weight:600;\">Forge<\u002Fspan>\n          <div style=\"height:38px; background:var(--track); border-radius:5px; overflow:hidden;\"><div style=\"width:60%; height:100%; background:linear-gradient(90deg,#D82D1C,#FF8A30); transform-origin:left; animation:barGrow 1.2s .25s cubic-bezier(.16,1,.3,1) both; box-shadow:0 0 22px rgba(255,138,48,.45);\"><\u002Fdiv><\u002Fdiv>\n          <span style=\"font-family:'JetBrains Mono',monospace; color:var(--accent); font-size:15px; font-weight:700;\">6/10<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--dim); margin:34px 0 20px;\">TOKENS PER FIX<\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:130px 1fr 70px; gap:16px 18px; align-items:center;\">\n          <span style=\"color:var(--muted2); font-size:15px;\">raw CLI<\u002Fspan>\n          <div style=\"height:20px; background:var(--track); border-radius:4px; overflow:hidden;\"><div style=\"width:100%; height:100%; background:var(--bar); transform-origin:left; animation:barGrow 1.2s .4s cubic-bezier(.16,1,.3,1) both;\"><\u002Fdiv><\u002Fdiv>\n          <span style=\"font-family:'JetBrains Mono',monospace; color:var(--muted2); font-size:14px;\">3.57M<\u002Fspan>\n          <span style=\"color:var(--ink); font-size:15px; font-weight:600;\">Forge<\u002Fspan>\n          <div style=\"height:20px; background:var(--track); border-radius:4px; overflow:hidden;\"><div style=\"width:79%; height:100%; background:#FF8A30; transform-origin:left; animation:barGrow 1.2s .55s cubic-bezier(.16,1,.3,1) both;\"><\u002Fdiv><\u002Fdiv>\n          <span style=\"font-family:'JetBrains Mono',monospace; color:var(--accent); font-size:14px; font-weight:700;\">2.83M<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SUBSCRIPTION BRIDGE -->\n  <section data-screen-label=\"subscription bridge\" style=\"padding:clamp(56px,9vw,96px) clamp(20px,5vw,64px); border-top:1px solid var(--border);\">\n    <div style=\"max-width:1060px; margin:0 auto; animation:secIn .9s cubic-bezier(.16,1,.3,1) both; animation-timeline:view(); animation-range:entry 0% entry 35%;\">\n      <h2 style=\"margin:0; font-size:clamp(32px,4.8vw,46px); font-weight:700; letter-spacing:-0.02em; max-width:720px; text-wrap:balance;\">Already paying for Claude? <span style=\"color:var(--accent);\">Run it through Forge.<\u002Fspan><\u002Fh2>\n      <p style=\"margin:20px 0 0; color:var(--muted); font-size:18px; line-height:1.6; max-width:640px;\">Bring the plan you already pay for into the mesh and get routing, failover, and the reliability layer on top. Where a provider allows it, Forge signs in natively with headless OAuth; where third-party OAuth is banned, it drives the official CLI as a bridge. Either way, no other agent does this.<\u002Fp>\n      <div data-cols5=\"1\" style=\"display:grid; grid-template-columns:auto minmax(40px,1fr) auto minmax(40px,1fr) auto; align-items:center; margin-top:52px;\">\n        <div style=\"display:flex; flex-direction:column; gap:12px;\">\n          <span style=\"font-family:'JetBrains Mono',monospace; font-size:14px; color:var(--ink2); border:1px solid var(--border2); border-radius:8px; padding:12px 20px; background:var(--panel); transition:border-color .25s;\" style-hover=\"border-color:var(--accent);\">claude-cli <span style=\"color:var(--dim);\">· CLI bridge · Max plan<\u002Fspan><\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace; font-size:14px; color:var(--ink2); border:1px solid var(--border2); border-radius:8px; padding:12px 20px; background:var(--panel); transition:border-color .25s;\" style-hover=\"border-color:var(--accent);\">codex <span style=\"color:var(--dim);\">· native OAuth · Pro plan<\u002Fspan><\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace; font-size:14px; color:var(--ink2); border:1px solid var(--border2); border-radius:8px; padding:12px 20px; background:var(--panel); transition:border-color .25s;\" style-hover=\"border-color:var(--accent);\">grok <span style=\"color:var(--dim);\">· native OAuth · xAI<\u002Fspan><\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace; font-size:14px; color:var(--ink2); border:1px solid var(--border2); border-radius:8px; padding:12px 20px; background:var(--panel); transition:border-color .25s;\" style-hover=\"border-color:var(--accent);\">antigravity <span style=\"color:var(--dim);\">· CLI bridge · free Gemini<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div data-flow=\"1\" style=\"height:2px; margin:0 10px; background:linear-gradient(90deg, transparent, #FF8A30, transparent); background-size:200% 100%; animation:flow 2.2s linear infinite;\"><\u002Fdiv>\n        <div style=\"display:flex; align-items:center; gap:14px; border:1px solid var(--border-hot); border-radius:12px; padding:22px 28px; background:var(--panel-hot); animation:emberBed 3.5s ease-in-out infinite;\">\n          <img src=\"75450221-0c38-4257-a08a-23e061bd6408\" alt=\"\" style=\"width:44px; height:44px;\">\n          <div><div style=\"font-weight:700; font-size:18px;\">Forge mesh<\u002Fdiv><div style=\"color:var(--muted2); font-size:13px; font-family:'JetBrains Mono',monospace;\">routing · failover · gate<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div data-flow=\"1\" style=\"height:2px; margin:0 10px; background:linear-gradient(90deg, transparent, #4BD4DA, transparent); background-size:200% 100%; animation:flow 2.2s 1s linear infinite;\"><\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:12px;\">\n          <span style=\"display:flex; align-items:center; gap:10px; font-size:14.5px; color:var(--ink2); border:1px solid var(--green-bd); border-radius:8px; padding:12px 20px; background:var(--green-bg);\"><span style=\"color:var(--green); font-weight:700;\">✓<\u002Fspan> 50% more bugs fixed<\u002Fspan>\n          <span style=\"display:flex; align-items:center; gap:10px; font-size:14.5px; color:var(--ink2); border:1px solid var(--green-bd); border-radius:8px; padding:12px 20px; background:var(--green-bg);\"><span style=\"color:var(--green); font-weight:700;\">✓<\u002Fspan> quota conserved<\u002Fspan>\n          <span style=\"display:flex; align-items:center; gap:10px; font-size:14.5px; color:var(--ink2); border:1px solid var(--green-bd); border-radius:8px; padding:12px 20px; background:var(--green-bg);\"><span style=\"color:var(--green); font-weight:700;\">✓<\u002Fspan> never rate-limit stranded<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:40px; font-family:'JetBrains Mono',monospace; font-size:14px; color:var(--code); background:var(--panel); border:1px solid var(--border2); border-radius:8px; padding:14px 20px; display:inline-block;\">$ forge run --model claude-cli::sonnet \"fix the flaky auth test\"<\u002Fdiv>\n      <p style=\"margin:14px 0 0; color:var(--dim); font-size:13.5px; max-width:640px;\">OAuth is fully headless: paste-redirect or RFC 8628 device flow, state + PKCE verified, tokens in the OS keyring. Anthropic and Antigravity ban third-party OAuth, so those plans ride the official CLI as a bridge instead; Codex and Grok run natively.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FREE -->\n  <section data-screen-label=\"free setup\" style=\"padding:clamp(56px,9vw,96px) clamp(20px,5vw,64px); border-top:1px solid var(--border); background:radial-gradient(800px 400px at 10% 90%, rgba(75,212,218,.05), transparent 60%);\">\n    <div style=\"max-width:1060px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fit, minmax(340px, 1fr)); gap:clamp(36px,6vw,80px); animation:secIn .9s cubic-bezier(.16,1,.3,1) both; animation-timeline:view(); animation-range:entry 0% entry 35%;\">\n      <div>\n        <h2 style=\"margin:0; font-size:clamp(32px,4.8vw,46px); font-weight:700; letter-spacing:-0.02em;\">Frontier coding at <span style=\"color:var(--accent);\">$0.<\u002Fspan><\u002Fh2>\n        <p style=\"margin:20px 0 0; color:var(--muted); font-size:17px; line-height:1.65;\">Forge runs free with zero paid keys. Connect a few free-tier providers and the mesh routes across them, failing over automatically when one is throttled. Keys live in your OS keyring, never in config.<\u002Fp>\n        <p style=\"margin:16px 0 0; color:var(--muted2); font-size:15px; line-height:1.65;\">Stack multiple keys per provider to multiply free limits: two Groq keys ≈ double the requests per minute.<\u002Fp>\n        <div style=\"margin-top:28px; font-family:'JetBrains Mono',monospace; font-size:13.5px; line-height:2.1; color:var(--ink2); background:var(--panel); border:1px solid var(--border2); border-radius:8px; padding:18px 24px;\">\n          <div><span style=\"color:var(--accent);\">$<\u002Fspan> forge auth groq<\u002Fdiv>\n          <div><span style=\"color:var(--accent);\">$<\u002Fspan> forge auth groq <span style=\"color:var(--dim);\"># again, Forge round-robins<\u002Fspan><\u002Fdiv>\n          <div><span style=\"color:var(--accent);\">$<\u002Fspan> forge auth nvidia<\u002Fdiv>\n          <div><span style=\"color:var(--accent);\">$<\u002Fspan> forge chat <span style=\"color:var(--dim);\"># routed across all of it<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:14px; justify-content:center;\">\n        <div style=\"display:grid; grid-template-columns:110px 1fr auto; gap:18px; align-items:center; border:1px solid var(--border); border-radius:10px; padding:18px 24px; background:var(--panel); transition:transform .25s, border-color .25s;\" style-hover=\"transform:translateX(6px); border-color:var(--border-hot);\">\n          <span style=\"font-weight:700; font-size:16px;\">Groq<\u002Fspan><span style=\"color:var(--muted2); font-size:14px; font-family:'JetBrains Mono',monospace;\">llama-3.3-70b · qwen3-32b · gpt-oss-120b<\u002Fspan><span style=\"color:var(--cy); font-size:13px; font-family:'JetBrains Mono',monospace;\">1K req/day<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:110px 1fr auto; gap:18px; align-items:center; border:1px solid var(--border); border-radius:10px; padding:18px 24px; background:var(--panel); transition:transform .25s, border-color .25s;\" style-hover=\"transform:translateX(6px); border-color:var(--border-hot);\">\n          <span style=\"font-weight:700; font-size:16px;\">NVIDIA<\u002Fspan><span style=\"color:var(--muted2); font-size:14px; font-family:'JetBrains Mono',monospace;\">deepseek-r1 · llama-405b · 100+ models<\u002Fspan><span style=\"color:var(--cy); font-size:13px; font-family:'JetBrains Mono',monospace;\">40 RPM<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:110px 1fr auto; gap:18px; align-items:center; border:1px solid var(--border); border-radius:10px; padding:18px 24px; background:var(--panel); transition:transform .25s, border-color .25s;\" style-hover=\"transform:translateX(6px); border-color:var(--border-hot);\">\n          <span style=\"font-weight:700; font-size:16px;\">Cerebras<\u002Fspan><span style=\"color:var(--muted2); font-size:14px; font-family:'JetBrains Mono',monospace;\">qwen-3-coder-480b · gpt-oss-120b<\u002Fspan><span style=\"color:var(--cy); font-size:13px; font-family:'JetBrains Mono',monospace;\">14.4K/day<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:110px 1fr auto; gap:18px; align-items:center; border:1px solid var(--border); border-radius:10px; padding:18px 24px; background:var(--panel); transition:transform .25s, border-color .25s;\" style-hover=\"transform:translateX(6px); border-color:var(--border-hot);\">\n          <span style=\"font-weight:700; font-size:16px;\">Gemini<\u002Fspan><span style=\"color:var(--muted2); font-size:14px; font-family:'JetBrains Mono',monospace;\">flash · 1M context<\u002Fspan><span style=\"color:var(--cy); font-size:13px; font-family:'JetBrains Mono',monospace;\">1.5K/day<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"color:var(--dim); font-size:13px; font-family:'JetBrains Mono',monospace; text-align:right;\">+ SambaNova · Mistral · OpenRouter · Cohere …<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ARSENAL -->\n  <section id=\"arsenal\" data-screen-label=\"feature arsenal\" style=\"padding:clamp(56px,9vw,96px) clamp(20px,5vw,64px); border-top:1px solid var(--border);\">\n    <div style=\"max-width:1060px; margin:0 auto; animation:secIn .9s cubic-bezier(.16,1,.3,1) both; animation-timeline:view(); animation-range:entry 0% entry 35%;\">\n      <h2 style=\"margin:0; font-size:clamp(32px,4.8vw,46px); font-weight:700; letter-spacing:-0.02em; max-width:680px; text-wrap:balance;\">Not a wrapper. <span style=\"color:var(--accent);\">A full workshop.<\u002Fspan><\u002Fh2>\n      <div style=\"display:grid; grid-template-columns:repeat(12, 1fr); gap:20px; margin-top:52px;\">\n        <div data-col=\"1\" style=\"grid-column:span 7; border:1px solid var(--border); border-radius:12px; padding:30px 34px; background:var(--panel); transition:transform .25s, border-color .25s;\" style-hover=\"transform:translateY(-4px); border-color:var(--border-hot);\">\n          <div style=\"font-weight:700; font-size:20px;\">Lattice · code intelligence built in<\u002Fdiv>\n          <p style=\"margin:10px 0 0; color:var(--muted2); font-size:15px; line-height:1.6;\">A tree-sitter symbol graph across 9 languages: blast radius, call chains, semantic retrieval, auto-injected before every turn.<\u002Fp>\n          <div style=\"margin-top:20px; font-family:'JetBrains Mono',monospace; font-size:13px; line-height:2.0; color:var(--ink2); background:#080610; border-radius:8px; padding:16px 20px;\">\n            <div><span style=\"color:var(--accent);\">$<\u002Fspan> forge lattice impact <span style=\"color:#7AB7FF;\">\"UserRepository\"<\u002Fspan><\u002Fdiv>\n            <div style=\"color:var(--cy);\">├─ AuthService <span style=\"color:var(--dim);\">· 12 call sites<\u002Fspan><\u002Fdiv>\n            <div style=\"color:var(--cy);\">├─ SessionStore <span style=\"color:var(--dim);\">· 4 call sites<\u002Fspan><\u002Fdiv>\n            <div style=\"color:#F35C5C;\">└─ 3 tests would break<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-col=\"1\" style=\"grid-column:span 5; border:1px solid var(--border); border-radius:12px; padding:30px 34px; background:var(--panel); transition:transform .25s, border-color .25s;\" style-hover=\"transform:translateY(-4px); border-color:var(--border-hot);\">\n          <div style=\"font-weight:700; font-size:20px;\">forge blame · AI provenance<\u002Fdiv>\n          <p style=\"margin:10px 0 0; color:var(--muted2); font-size:15px; line-height:1.6;\">Trace any line back to the model, session, prompt, and reasoning that wrote it. Replay the session. Fork the counterfactual.<\u002Fp>\n          <div style=\"margin-top:20px; font-family:'JetBrains Mono',monospace; font-size:13px; line-height:2.0; color:var(--ink2); background:#080610; border-radius:8px; padding:16px 20px;\">\n            <div><span style=\"color:var(--accent);\">$<\u002Fspan> forge blame src/auth.rs --line 42<\u002Fdiv>\n            <div><span style=\"color:var(--gold);\">opus-4<\u002Fspan> <span style=\"color:var(--dim);\">· session a1c3 · \"harden token refresh\"<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-col=\"1\" style=\"grid-column:span 4; border:1px solid var(--border); border-radius:12px; padding:28px 30px; background:var(--panel); transition:transform .25s, border-color .25s;\" style-hover=\"transform:translateY(-4px); border-color:var(--border-hot);\">\n          <div style=\"font-weight:700; font-size:18px;\">/duel · the arena<\u002Fdiv>\n          <p style=\"margin:10px 0 0; color:var(--muted2); font-size:14.5px; line-height:1.6;\">Race 3 models on one task in parallel worktrees. Merge the winner. Routing learns per-repo from recorded wins.<\u002Fp>\n        <\u002Fdiv>\n        <div data-col=\"1\" style=\"grid-column:span 4; border:1px solid var(--border); border-radius:12px; padding:28px 30px; background:var(--panel); transition:transform .25s, border-color .25s;\" style-hover=\"transform:translateY(-4px); border-color:var(--border-hot);\">\n          <div style=\"font-weight:700; font-size:18px;\">forge queue · overnight autopilot<\u002Fdiv>\n          <p style=\"margin:10px 0 0; color:var(--muted2); font-size:14.5px; line-height:1.6;\">Queue tasks by day, drain them headless into isolated worktrees by night. Wake up to review-ready branches and a morning digest.<\u002Fp>\n        <\u002Fdiv>\n        <div data-col=\"1\" style=\"grid-column:span 4; border:1px solid var(--border); border-radius:12px; padding:28px 30px; background:var(--panel); transition:transform .25s, border-color .25s;\" style-hover=\"transform:translateY(-4px); border-color:var(--border-hot);\">\n          <div style=\"font-weight:700; font-size:18px;\">Cross-session memory<\u002Fdiv>\n          <p style=\"margin:10px 0 0; color:var(--muted2); font-size:14.5px; line-height:1.6;\">Durable, typed facts per project, auto-captured at turn end and relevance-ranked back into context next session.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"grid-column:span 12; border:1px solid var(--border-hot); border-radius:12px; padding:30px 34px; background:var(--panel-hot); display:grid; grid-template-columns:1fr auto; gap:40px; align-items:center;\">\n          <div>\n            <div style=\"font-weight:700; font-size:20px;\">A harness that doesn't lie<\u002Fdiv>\n            <p style=\"margin:10px 0 0; color:var(--muted2); font-size:15px; line-height:1.6; max-width:560px;\">Tool-grounded completion gates, doom-loop guards, recovery of tool calls written as prose. It never reports a phantom success, and there's a cargo test behind every one of those claims.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:8px; font-family:'JetBrains Mono',monospace; font-size:13px;\">\n            <span style=\"border:1px solid var(--border2); border-radius:6px; padding:8px 14px; color:var(--muted2);\">Read-only<\u002Fspan>\n            <span style=\"border:1px solid var(--border2); border-radius:6px; padding:8px 14px; color:var(--muted2);\">Ask<\u002Fspan>\n            <span style=\"border:1px solid #FF8A30; border-radius:6px; padding:8px 14px; color:var(--accent); font-weight:700;\">Auto-edit<\u002Fspan>\n            <span style=\"border:1px solid var(--border2); border-radius:6px; padding:8px 14px; color:var(--muted2);\">Full<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; gap:36px; margin-top:44px; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:13.5px; color:var(--muted2); flex-wrap:wrap;\">\n        <span>⌨ full-screen TUI<\u002Fspan><span>🖥 desktop app<\u002Fspan><span>📱 iOS · Android · Web<\u002Fspan><span>⚙ OpenAI-compatible API<\u002Fspan><span>🔌 MCP client + server<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SURFACES -->\n  <section id=\"surfaces\" data-screen-label=\"apps and surfaces\" style=\"padding:clamp(56px,9vw,96px) clamp( rder-top:1px solid var(--border); color:var(--bar); text-align:center;\">✕<\u002Fdiv>\n        <div style=\"padding:15px 12px; border-top:1px solid var(--border); color:var(--bar); text-align:center;\">✕<\u002Fdiv>\n        <div style=\"padding:15px 12px; border-top:1px solid var(--border); color:var(--bar); text-align:center;\">✕<\u002Fdiv>\n        <div style=\"padding:15px 12px; border-top:1px solid var(--border); color:var(--bar); text-align:center;\">✕<\u002Fdiv>\n        <div style=\"padding:15px 24px; border-top:1px solid var(--border); color:var(--ink2);\">Queryable code graph (blast radius / call chains)<\u002Fdiv>\n        <div style=\"padding:15px 12px; border-top:1px solid var(--border); background:rgba(255,138,48,.05); color:var(--green); text-align:center; font-weight:700;\">✓<\u002Fdiv>\n        <div style=\"padding:15px 12px; border-top:1px solid var(--border); color:var(--bar); text-align:center;\">✕<\u002Fdiv>\n        <div style=\"padding:15px 12px; border-top:1px solid var(--border); color:var(--bar); text-align:center;\">✕<\u002Fdiv>\n        <div style=\"padding:15px 12px; border-top:1px solid var(--border); color:var(--dim); text-align:center;\">repo-map<\u002Fdiv>\n        <div style=\"padding:15px 12px; border-top:1px solid var(--border); color:var(--bar); text-align:center;\">✕<\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:16px 0 0; color:var(--dim); font-size:13px;\">Accurate per cell, last verified mid-2026. Full sourced breakdown in <a href=\"https://github.com/adulari/forge/blob/main/docs/comparison.md\">docs/comparison.md<\u002Fa>.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- INSTALL CTA -->\n  <section id=\"install\" data-screen-label=\"install cta\" style=\"position:relative; overflow:hidden; padding:clamp(64px,10vw,120px) clamp(20px,5vw,64px); border-top:1px solid var(--border); background:radial-gradient(900px 480px at 50% 130%, rgba(216,45,28,.35), rgba(255,96,32,.12) 40%, transparent 70%); text-align:center;\">\n    <sc-if value=\"{{ embersOn }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"position:absolute; inset:0; pointer-events:none;\">\n        <div style=\"position:absolute; bottom:0; left:22%; width:3px; height:3px; border-radius:50%; background:#FF9828; animation:rise 7s linear infinite;\"><\u002Fdiv>\n        <div style=\"position:absolute; bottom:0; left:44%; width:2px; height:2px; border-radius:50%; background:#FFD040; animation:rise 9s 2.4s linear infinite;\"><\u002Fdiv>\n        <div style=\"position:absolute; bottom:0; left:58%; width:3px; height:3px; border-radius:50%; background:#FF6020; animation:rise 6s 1.2s linear infinite;\"><\u002Fdiv>\n        <div style=\"position:absolute; bottom:0; left:78%; width:2px; height:2px; border-radius:50%; background:#FFD040; animation:rise 8s 3.8s linear infinite;\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <div style=\"position:relative;\">\n      <h2 style=\"margin:0; font-size:clamp(36px,5.5vw,56px); font-weight:700; letter-spacing:-0.02em;\">Light the forge.<\u002Fh2>\n      <p style=\"margin:18px auto 0; color:var(--muted); font-size:18px; max-width:520px; line-height:1.6;\">One line. One static binary. No Node, no Python, no Electron, and no API key needed to try it.<\u002Fp>\n      <div style=\"display:inline-flex; align-items:center; gap:16px; margin-top:38px; padding:17px 24px; border-radius:10px; background:#12080A; --accent:#FF8A30; --code:#FFD9B8; --muted2:#8B90A5; --border-hot:#3A2418; animation:heatPulse 3s ease-in-out infinite; font-family:'JetBrains Mono',monospace; font-size:15px; color:var(--code); cursor:pointer; transition:transform .2s;\" style-hover=\"transform:translateY(-2px);\" sc-camel-on-click=\"{{ copyInstall }}\">\n        <span style=\"color:var(--accent);\">$<\u002Fspan>\n        <span>curl -fsSL forge.adulari.dev/install.sh | sh<\u002Fspan>\n        <span style=\"color:var(--muted2); border-left:1px solid var(--border-hot); padding-left:16px; min-width:52px; text-align:right;\">{{ copyLabel }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex; justify-content:center; gap:12px; margin-top:26px; font-family:'JetBrains Mono',monospace; font-size:13px; flex-wrap:wrap;\">\n        <sc-for list=\"{{ altChips }}\" as=\"chip\" hint-placeholder-count=\"3\">\n          <span style=\"display:inline-flex; align-items:center; gap:10px; color:var(--muted2); border:1px solid var(--border2); border-radius:8px; padding:9px 14px; cursor:pointer; transition:border-color .2s, color .2s;\" style-hover=\"border-color:var(--accent); color:var(--ink2);\" sc-camel-on-click=\"{{ chip.pick }}\">{{ chip.cmd }}<span style=\"color:var(--dim);\">{{ chip.label }}<\u002Fspan><\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"margin-top:30px; font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--dim);\">try it with zero keys: <span style=\"color:var(--cy);\">forge tour --demo<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FAQ -->\n  <section data-screen-label=\"faq\" style=\"padding:56px clamp(20px,5vw,64px); border-top:1px solid var(--border);\">\n    <div style=\"max-width:1060px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:36px;\">\n      <div><div style=\"color:var(--ink); font-weight:600; font-size:16px;\">Why AGPL-3.0?<\u002Fdiv><p style=\"margin:8px 0 0; color:var(--muted2); font-size:14.5px; line-height:1.6;\">So Forge stays open: anyone can read, audit, and improve the harness, and improvements flow back instead of disappearing into closed forks.<\u002Fp><\u002Fdiv>\n      <div><div style=\"color:var(--ink); font-weight:600; font-size:16px;\">Is it really free?<\u002Fdiv><p style=\"margin:8px 0 0; color:var(--muted2); font-size:14.5px; line-height:1.6;\">Yes. One static binary, zero paid keys required. Connect free-tier providers, or bridge a subscription you already pay for.<\u002Fp><\u002Fdiv>\n      <div><div style=\"color:var(--ink); font-weight:600; font-size:16px;\">How do I support it?<\u002Fdiv><p style=\"margin:8px 0 0; color:var(--muted2); font-size:14.5px; line-height:1.6;\">Star the <a href=\"https://github.com/adulari/forge\">repo<\u002Fa>, file issues, or <a href=\"https://github.com/sponsors/Adulari\">sponsor development<\u002Fa>. Corrections to the comparison table are welcome.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FOOTER -->\n  <footer data-screen-label=\"footer\" style=\"display:flex; align-items:center; gap:28px; flex-wrap:wrap; padding:28px clamp(20px,5vw,64px); border-top:1px solid var(--border); font-size:13.5px; color:var(--dim);\">\n    <span style=\"display:flex; align-items:center; gap:8px; color:var(--muted2);\"><img src=\"75450221-0c38-4257-a08a-23e061bd6408\" alt=\"\" style=\"width:20px; height:20px;\"> Forge · AGPL-3.0<\u002Fspan>\n    <span style=\"margin-left:auto;\"><\u002Fspan>\n    <a href=\"https://github.com/adulari/forge\" style=\"color:var(--muted2);\">GitHub<\u002Fa>\n    <a href=\"docs.html\" style=\"color:var(--muted2);\">Docs<\u002Fa>\n    <a href=\"https://github.com/adulari/forge/blob/main/docs/comparison.md\" style=\"color:var(--muted2);\">Compare<\u002Fa>\n    <a href=\"https://github.com/sponsors/Adulari\" style=\"color:var(--muted2);\">♥ Sponsor<\u002Fa>\n    <span>built with Rust<\u002Fspan>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;embers&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Motion&quot;}, &quot;showComparison&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Sections&quot;}}\">\nclass Component extends DCLogic {\n  state = { scene: 'chat', typed: '', lineN: 0, busy: false, perm: false, cost: 0, model: 'auto', tier: '', done: false, wfStep: 0, vStep: 0, mStep: 0, vt: 0, elapsed: 0, spin: 0, effort: 4, copied: false, altCopied: -1, statT: 0, theme: 'dark' };\n  componentDidMount() {\n    try { if (localStorage.getItem('forge-theme') === 'light') this.setState({ theme: 'light' }); } catch (e) {}\n    this._script = this.buildChatScript();\n    this._i = 0;\n    this.runScript();\n    this._spinT = setInterval(() => { this.setState(s => ({ spin: s.spin + 1, elapsed: s.busy ? s.elapsed + 0.11 : s.elapsed, vt: (s.scene === 'voice' && s.vStep === 1) ? s.vt + 0.11 : s.vt })); }, 110);\n    let t = 0;\n    this._statT = setInterval(() => {\n      t += 0.045;\n      if (t >= 1) { t = 1; clearInterval(this._statT); }\n      const e = 1 - Math.pow(1 - t, 3);\n      this.setState({ statT: e });\n    }, 35);\n  }\n  componentWillUnmount() { clearTimeout(this._t); clearTimeout(this._c); clearInterval(this._spinT); clearInterval(this._statT); }\n  sceneReset(scene) {\n    return { scene, typed: '', lineN: 0, busy: false, perm: false, cost: 0, model: 'auto', tier: '', done: false, wfStep: 0, vStep: 0, mStep: 0, vt: 0, elapsed: 0 };\n  }\n  buildChatScript() {\n    const E = [];\n    const push = (d, p) => E.push({ d, p });\n    const prompt = 'add OpenTelemetry tracing to the HTTP layer';\n    push(1200, {});\n    for (let i = 1; i <= prompt.length; i++) push(i === 1 ? 600 : 26, { typed: prompt.slice(0, i) });\n    push(600, { typed: '', lineN: 2, busy: true, model: 'claude-opus', tier: '[complex] ' });\n    push(900, { lineN: 4 });\n    push(1000, { lineN: 5, cost: 0.006 });\n    push(800, { perm: true });\n    push(1900, { perm: false, lineN: 6, cost: 0.014 });\n    push(1200, { lineN: 7, model: 'deepseek-r1', cost: 0.014 });\n    push(1100, { lineN: 8, cost: 0.031 });\n    push(1300, { lineN: 9, busy: false, cost: 0.038, done: true });\n    push(5200, { switch: 'wf' });\n    return E;\n  }\n  buildWfScript() {\n    const E = [];\n    const push = (d, p) => E.push({ d, p });\n    const cmd = '/workflow run test-hardening';\n    push(900, {});\n    for (let i = 1; i <= cmd.length; i++) push(i === 1 ? 500 : 30, { typed: cmd.slice(0, i) });\n    push(600, { typed: '', busy: true, wfStep: 1, model: 'mesh', tier: '' });\n    push(1100, { wfStep: 2 });\n    push(1000, { wfStep: 3, cost: 0.002 });\n    push(1700, { wfStep: 4, cost: 0.005 });\n    push(1300, { wfStep: 5, cost: 0.011 });\n    push(1800, { wfStep: 6, cost: 0.032 });\n    push(1600, { wfStep: 7, busy: false, cost: 0.087 });\n    push(5600, { switch: 'voice' });\n    return E;\n  }\n  buildVoiceScript() {\n    const E = [];\n    const push = (d, p) => E.push({ d, p });\n    const cmd = '/voice';\n    push(900, {});\n    for (let i = 1; i <= cmd.length; i++) push(i === 1 ? 500 : 60, { typed: cmd.slice(0, i) });\n    push(500, { typed: '', vStep: 1 });\n    push(4300, { vStep: 2 });\n    push(1700, { vStep: 3, typed: 'refactor the retry logic in the mesh router' });\n    push(4200, { switch: 'mesh' });\n    return E;\n  }\n  buildMeshScript() {\n    const E = [];\n    const push = (d, p) => E.push({ d, p });\n    const cmd = '/mesh refactor the auth middleware';\n    push(900, {});\n    for (let i = 1; i <= cmd.length; i++) push(i === 1 ? 500 : 28, { typed: cmd.slice(0, i) });\n    push(500, { typed: '', mStep: 1 });\n    push(1400, { mStep: 2 });\n    push(1000, { mStep: 3 });\n    push(1100, { mStep: 4 });\n    push(1200, { mStep: 5 });\n    push(6200, { switch: 'chat' });\n    return E;\n  }\n  setScene(scene) {\n    clearTimeout(this._t);\n    const builders = { chat: () => this.buildChatScript(), wf: () => this.buildWfScript(), voice: () => this.buildVoiceScript(), mesh: () => this.buildMeshScript() };\n    this._script = (builders[scene] || builders.chat)();\n    this._i = 0;\n    this.setState(this.sceneReset(scene));\n    this.runScript();\n  }\n  runScript() {\n    const ev = this._script[this._i];\n    if (!ev) return;\n    this._t = setTimeout(() => {\n      if (ev.p.switch) { this.setScene(ev.p.switch); return; }\n      this.setState(ev.p);\n      this._i++;\n      this.runScript();\n    }, ev.d);\n  }\n  renderVals() {\n    const O = '#FF8A30', T = 'var(--ink2)', D = 'var(--dim)', CY = '#4BD4DA', G = '#5CD07A', R = '#F35C5C', Y = '#EEBC52', U = '#7AB7FF', GOLD = '#FFD040', ACC = '#52A2FF';\n    const LINES = [\n      { mt: 16, s: [{ t: 'you', c: U, w: 700 }] },\n      { mt: 2, s: [{ t: 'add OpenTelemetry tracing to the HTTP layer', c: T, w: 400 }] },\n      { mt: 14, s: [{ t: '⚒ forge', c: O, w: 700 }] },\n      { mt: 2, s: [{ t: 'Adding tracing to the HTTP middleware stack. Reading the current layout first.', c: T, w: 400 }] },\n      { mt: 10, s: [{ t: '● read_file ', c: CY, w: 400 }, { t: 'src/http/mod.rs', c: T, w: 400 }] },\n      { mt: 4, s: [{ t: '● edit ', c: CY, w: 400 }, { t: 'src/http/middleware.rs ', c: T, w: 400 }, { t: '+42 ', c: G, w: 400 }, { t: '−3', c: R, w: 400 }] },\n      { mt: 4, s: [{ t: '⚠ anthropic 429 ', c: Y, w: 400 }, { t: '· reset 42s away · failover → ', c: D, w: 400 }, { t: 'nvidia::deepseek-r1 ', c: O, w: 700 }, { t: '(free)', c: D, w: 400 }] },\n      { mt: 4, s: [{ t: '● bash ', c: CY, w: 400 }, { t: 'cargo test ', c: T, w: 400 }, { t: '→ 47 passed', c: G, w: 400 }] },\n      { mt: 10, s: [{ t: '✓ done', c: G, w: 700 }, { t: ' · 2 files changed · $0.038 · 41s · completion gate: verified', c: D, w: 400 }] },\n    ];\n    const SPINNER = ['⠋', '⠙', '⠹', '⠸', '⠼', '⠴', '⠦', '⠧', '⠇', '⠏'];\n    const RAMP = ['#D82D1C', '#FF6020', '#FF9828', '#FFD040', '#FFF6E0'];\n    const NAMES = ['low', 'medium', 'high', 'xhigh', 'white-hot'];\n    const DESCS = [\n      'Bias the whole route toward cheaper models. Spend only where it matters.',\n      'Balanced routing across the ranked catalog. The default.',\n      'Bias toward stronger-benchmarked models, only when the score gap is real.',\n      'Maximum reasoning on frontier models for the hardest work.',\n      'Maximum reasoning plus automatic workflow-script orchestration on top l ', c: CY },\n      { t: '[' + a.model + '] ', c: D },\n      { t: a.task, c: T },\n      { t: a.done ? '  ' + a.cost : '', c: D },\n    ] });\n    const spawned = wfAgents.filter(a => a.on);\n    const wdone = spawned.filter(a => a.done).length;\n    const wfLines = [];\n    if (w >= 1 && spawned.length === 0) wfLines.push({ mt: 8, s: [{ t: sp + ' authoring… waiting for the first agent to spawn', c: D }] });\n    if (spawned.length > 0) wfLines.push({ mt: 8, s: [...meterSpans(wdone / spawned.length, 16), { t: '  ' + wdone + '/' + spawned.length + ' agents · ' + (spawned.length - wdone) + ' running · $' + st.cost.toFixed(4), c: T }] });\n    if (w >= 7) wfLines.push({ mt: 4, s: [{ t: '✓ all agents succeeded · tests green after 2 iterations', c: G }] });\n    if (w >= 2) {\n      const p1 = wfAgents.slice(0, 2).filter(a => a.on);\n      const p1done = p1.filter(a => a.done).length;\n      wfLines.push({ mt: 14, s: [{ t: '▶ ', c: Y, w: 700 }, p1done < p1.length ? { t: sp + ' ', c: ACC } : { t: '✓ ', c: G }, { t: 'write failing tests  ', c: Y, w: 700 }, ...meterSpans(p1.length ? p1done / p1.length : 0, 10), { t: ' ' + p1done + '/2', c: D }] });\n      wfAgents.slice(0, 2).forEach((a, ix) => {\n        if (!a.on) return;\n        wfLines.push(agentRow(a, ix === 0));\n        if (!a.done) wfLines.push({ mt: 2, s: [{ t: '      ▏' + a.edge, c: D, f: 'italic' }] });\n      });\n    }\n    if (w >= 5) {\n      const a3 = wfAgents[2];\n      wfLines.push({ mt: 14, s: [{ t: '▶ ', c: Y, w: 700 }, a3.done ? { t: '✓ ', c: G } : { t: sp + ' ', c: ACC }, { t: 'fix until green  ', c: Y, w: 700 }, ...meterSpans(a3.done ? 1 : 0, 10), { t: ' ' + (a3.done ? 1 : 0) + '/1', c: D }] });\n      wfLines.push(agentRow(a3, false));\n      if (!a3.done) wfLines.push({ mt: 2, s: [{ t: '      ▏' + a3.edge, c: D, f: 'italic' }] });\n    }\n    if (w >= 6) {\n      wfLines.push({ mt: 14, s: [{ t: '── narration ──', c: D }] });\n      wfLines.push({ mt: 2, s: [{ t: '💬 ', c: ACC }, { t: '2 test files written, handing to the fixer', c: T }] });\n      if (w >= 7) wfLines.push({ mt: 2, s: [{ t: '💬 ', c: ACC }, { t: 'cargo test green, merging results', c: T }] });\n    }\n    const wfOpen = st.scene === 'wf' && w >= 1;\n    const wfFinished = w >= 7;\n    const BARS = ['▁', '▂', '▃', '▄', '▅', '▆', '▇', '█'];\n    let wave = '';\n    for (let i = 0; i < 36; i++) wave += BARS[Math.max(0, Math.min(7, Math.round((Math.sin(i * 1.7 + st.spin * 0.8) + Math.sin(i * 0.53 + st.spin * 0.31) + 2) / 4 * 7)))];\n    const mmss = (t) => { const s2 = Math.floor(t); return Math.floor(s2 / 60) + ':' + ('0' + (s2 % 60)).slice(-2); };\n    const voiceLines = [];\n    if (st.vStep === 1) {\n      voiceLines.push({ mt: 4, s: [((st.spin >> 2) % 2 === 0) ? { t: '● REC', c: R, w: 700 } : { t: '○ REC', c: D }, { t: '   ' + mmss(st.vt), c: T }] });\n      voiceLines.push({ mt: 8, s: [{ t: wave, c: ACC }] });\n      voiceLines.push({ mt: 8, s: [{ t: '  Enter transcribe · Esc cancel · r restart', c: D }] });\n    } else if (st.vStep === 2) {\n      voiceLines.push({ mt: 4, s: [{ t: sp + ' transcribing…', c: ACC }, { t: '   ' + mmss(st.vt), c: T }] });\n      voiceLines.push({ mt: 8, s: [{ t: wave, c: D }] });\n      voiceLines.push({ mt: 8, s: [{ t: '  please wait…', c: D }] });\n    }\n    const m = st.mStep;\n    const meshLines = [];\n    if (m === 1) meshLines.push({ mt: 4, s: [{ t: ' ' + sp + ' analyzing routing…', c: D }] });\n    if (m >= 2) {\n      meshLines.push({ mt: 2, s: [{ t: 'task       ', c: D }, { t: 'refactor the auth middleware', c: T }] });\n      meshLines.push({ mt: 2, s: [{ t: 'decision   ', c: D }, { t: 'standard   (multi-file edit, no new architecture)', c: ACC, w: 700 }] });\n      meshLines.push({ mt: 2, s: [{ t: 'selected   ', c: D }, { t: 'nvidia::deepseek-r1', c: G, w: 700 }] });\n      meshLines.push({ mt: 2, s: [{ t: 'fallbacks  cerebras::qwen-3-coder → groq::llama-3.3-70b → claude-cli::sonnet', c: D }] });\n    }\n    if (m >= 3) {\n      meshLines.push({ mt: 10, s: [{ t: '  anthropic  ', c: T }, ...meterSpans(0.62, 12), { t: '  62% · max plan · ok · spread 35%', c: D }] });\n      meshLines.push({ mt: 2, s: [{ t: '  groq       ', c: T }, ...meterSpans(0.14, 12), { t: '  14% · free · ok', c: D }] });\n      meshLines.push({ mt: 2, s: [{ t: '  nvidia     ', c: T }, ...meterSpans(0.08, 12), { t: '   8% · free · ok', c: D }] });\n      meshLines.push({ mt: 2, s: [{ t: '  conserve   spreading standard work onto free + subscription models', c: Y }] });\n    }\n    if (m >= 4) {\n      meshLines.push({ mt: 10, s: [{ t: '▶ #1  nvidia::deepseek-r1      68.40   free · frontier', c: G, w: 700 }] });\n      meshLines.push({ mt: 2, s: [{ t: '  #2  cerebras::qwen-3-coder   66.10   free', c: T }] });\n      meshLines.push({ mt: 2, s: [{ t: '  #3  groq::llama-3.3-70b      61.75   free', c: T }] });\n      meshLines.push({ mt: 2, s: [{ t: '  #4  claude-cli::sonnet       70.20   subscription · conserve −5', c: D }] });\n    }\n    if (m >= 5) meshLines.push({ mt: 10, s: [{ t: 'pick  ', c: D }, { t: 'nvidia::deepseek-r1', c: G, w: 700 }] });\n    const composerTone = st.perm ? Y : (st.busy ? ACC : O);\n    const composerTitle = st.perm ? '◉ respond' : (st.busy ? '▸ working…' : '✦ message');\n    let ghostText = '';\n    if (!st.typed && !st.busy && !st.perm && st.scene === 'chat') ghostText = st.done ? 'add span attributes for route params  ⇥ tab' : 'Message…   / commands  ·  @ files  ·  ? keys';\n    return {\n      chatLines: LINES.slice(0, st.lineN).map(norm),\n      wfLines: wfLines.map(norm),\n      wfTone: wfFinished ? G : O,\n      wfTitle: \"⛓ workflow 'test-hardening' · \" + (wfFinished ? '✓ finished' : sp + ' running') + ' · ⧖ ' + Math.round(st.elapsed) + 's',\n      chatContentDisplay: wfOpen ? 'none' : 'block',\n      wfPanelDisplay: wfOpen ? 'block' : 'none',\n      tabChatBg: st.scene === 'chat' ? '#FF8A30' : 'transparent',\n      tabChatC: st.scene === 'chat' ? '#0E0F15' : 'var(--muted2)',\n      tabWfBg: st.scene === 'wf' ? '#FF8A30' : 'transparent',\n      tabWfC: st.scene === 'wf' ? '#0E0F15' : 'var(--muted2)',\n      tabVoiceBg: st.scene === 'voice' ? '#FF8A30' : 'transparent',\n      tabVoiceC: st.scene === 'voice' ? '#0E0F15' : 'var(--muted2)',\n      tabMeshBg: st.scene === 'mesh' ? '#FF8A30' : 'transparent',\n      tabMeshC: st.scene === 'mesh' ? '#0E0F15' : 'var(--muted2)',\n      pickChat: () => this.setScene('chat'),\n      pickWf: () => this.setScene('wf'),\n      pickVoice: () => this.setScene('voice'),\n      pickMesh: () => this.setScene('mesh'),\n      voiceLines: voiceLines.map(norm),\n      meshLines: meshLines.map(norm),\n      voiceDisplay: (st.scene === 'voice' && (st.vStep === 1 || st.vStep === 2)) ? 'block' : 'none',\n      voiceTone: st.vStep === 2 ? ACC : R,\n      voiceTitle: st.vStep === 2 ? '⌬ voice · transcribing' : '● voice',\n      meshDisplay: (st.scene === 'mesh' && m >= 1) ? 'block' : 'none',\n      meshTitle: (m >= 5 ? '◈' : sp) + ' Model routing',\n      typedText: st.typed,\n      ghostText,\n      composerTone, composerTitle,\n      permDisplay: st.perm ? 'block' : 'none',\n      spinDisplay: st.busy ? 'inline' : 'none',\n      spinGlyph: sp,\n      slModel: st.model, slTier: st.tier,\n      slCost: '$' + st.cost.toFixed(3),\n      statBugs: Math.round(50 * st.statT),\n      statProviders: Math.round(17 * st.statT),\n      statTests: Math.round(324 * st.statT),\n      effortStops,\n      effortName: NAMES[ei],\n      effortDesc: DESCS[ei],\n      effortColor: stopText(ei),\n      copyLabel: st.copied ? 'copied ✓' : 'copy',\n      copyInstall: () => {\n        navigator.clipboard && navigator.clipboard.writeText('curl -fsSL forge.adulari.dev/install.sh | sh');\n        this.setState({ copied: true });\n        clearTimeout(this._c);\n        this._c = setTimeout(() => this.setState({ copied: false }), 1800);\n      },\n      altChips: ['brew install forge', 'cargo install forge-agent', 'irm forge.adulari.dev/install.ps1 | iex'].map((cmd, i) => ({\n        cmd,\n        label: st.altCopied === i ? '✓' : '⧉',\n        pick: () => {\n          navigator.clipboard && navigator.clipboard.writeText(cmd);\n          this.setState({ altCopied: i });\n          clearTimeout(this._a);\n          this._a = setTimeout(() => this.setState({ altCopied: -1 }), 1800);\n        },\n      })),\n      theme: st.theme,\n      themeGlyph: st.theme === 'light' ? '☾' : '☀',\n      toggleTheme: () => {\n        const t = st.theme === 'light' ? 'dark' : 'light';\n        try { localStorage.setItem('forge-theme', t); } catch (e) {}\n        this.setState({ theme: t });\n      },\n      embersOn: this.props.embers ?? true,\n      compareDisplay: (this.props.showComparison ?? true) ? 'block' : 'none',\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
